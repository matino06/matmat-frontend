<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/400.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/500.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/600.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.1/400.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.1/500.css" rel="stylesheet"/>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('mm-theme') || 'dark';
          document.documentElement.dataset.theme = t;
        } catch(e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    %sveltekit.head%
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>

    <script
      type="text/javascript"
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
    ></script>

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-E6F6X4X2XG"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-E6F6X4X2XG", {
        send_page_view: false,
      });
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
