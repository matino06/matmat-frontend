function render(s) {  // formule zaštiti od markdowna, pa ih vrati kao KaTeX
  const math = [];
  s = s.replace(/\$\$([\s\S]+?)\$\$|\\\(([\s\S]+?)\\\)/g, (m, a, b) => {
    math.push(katex.renderToString(a || b, {displayMode: !!a, throwOnError: false})); return `@@M${math.length - 1}@@`; });

function highlight(el, marks) {
  for (const mk of marks) {
    // formule: usporedi TeX izvor iz KaTeX anotacije
    el.querySelectorAll('.katex').forEach(k => {
      const a = k.querySelector('annotation');
      if (a && a.textContent.includes(mk.text)) { k.classList.add('mk', mk.kind); k.title = mk.note; }
    });
    // običan tekst
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {acceptNode: n =>
      n.parentElement.closest('.katex, .notes') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    const hits = [];
    while (walker.nextNode()) if (walker.currentNode.nodeValue.includes(mk.text)) hits.push(walker.currentNode);
    for (const node of hits) {
      const i = node.nodeValue.indexOf(mk.text);
      const r = node.splitText(i); r.splitText(mk.text.length);

    }
  }
}
const data = [{"id": "B01.01-1", "title": "B01.01 Gibanje, put i pomak, prosječna brzina + Jednoliko gibanje i njegovi grafovi — varijacija 1", "who": "Sol medium (predložak)", "task": "a) Električna kolica s kutijom učvršćenom na platformi krenu od ulaza u skladište, prijeđu \\(30\\ \\text{m}\\) prema istoku, a zatim \\(40\\ \\text{m}\\) prema sjeveru. Cijelo gibanje traje \\(50\\ \\text{s}\\). Koliki su prijeđeni put i iznos pomaka kolica te kamo je pomak usmjeren? Miruje li kutija u odnosu na platformu i u odnosu na ulaz u skladište?\n\nb) Ta se kolica vrate do ulaza istim putem za \\(80\\ \\text{s}\\), a zatim ondje miruju \\(10\\ \\text{s}\\). Koliki su ukupni put, pomak i prosječna brzina od prvog polaska u a) do kraja tog mirovanja? Je li prosječna brzina nula zato što su kolica ponovno kod ulaza?\n\nc) Nakon toga kolica od ulaza voze **jednoliko po ravnom hodniku** prema istoku brzinom \\(7{,}2\\ \\text{km/h}\\), tijekom \\(20\\ \\text{s}\\). Vrijeme sada mjerimo od početka te vožnje, a ulaz ima položaj \\(x_0=10\\ \\text{m}\\) na osi usmjerenoj prema istoku. Koliki put kolica prijeđu i koji im je konačni položaj? Skiciraj grafove položaja i brzine o vremenu te na grafu brzine označi površinu koja predstavlja prijeđeni put. Bi li pri dvostrukoj brzini graf položaja bio dvostruko strmiji? Mora li tijekom ove jednolike vožnje ukupna sila na kolica biti različita od nule?", "expl": "## 🧭 Put nije isto što i pomak\n\n**a) Koliki su prijeđeni put i iznos pomaka kolica te kamo je pomak usmjeren? Miruje li kutija u odnosu na platformu i u odnosu na ulaz u skladište?**\n\nZadano je da kolica s učvršćenom kutijom prijeđu \\(30\\ \\text{m}\\) prema istoku i \\(40\\ \\text{m}\\) prema sjeveru, za ukupno \\(50\\ \\text{s}\\).\n\n**Položaj** govori gdje se tijelo nalazi u odnosu na odabrano polazište, slično oznaci mjesta na karti. **Referentni sustav** čine odabrano polazište i smjerovi u odnosu na koje pratimo položaj i vrijeme. **Mehaničko gibanje** jest promjena položaja tijekom vremena, a **putanja** je crta koju tijelo pritom slijedi — poput traga kotača na podu.\n\nKutija ne mijenja položaj u odnosu na platformu, ali mijenja položaj u odnosu na ulaz. Zato je odgovor \\(\\textcolor{green}{\\text{kutija miruje u odnosu na platformu, a giba se u odnosu na ulaz}}\\). To je **relativnost gibanja**: bez odabranog referentnog sustava ne možemo reći miruje li tijelo ili se giba.\n\nPrvo jedna zamka: **put i pomak nisu isto**. Put je ukupna prijeđena duljina, kao broj koji bi zabilježio brojač prijeđenih metara, pa je **skalar** — ima iznos, ali nema smjer. Pomak je usmjerena strelica od početnog do konačnog položaja, pa je **vektor** — ima i iznos i smjer.\n\nSve su duljine već izražene u metrima, pa pretvorba nije potrebna. Put dobivamo zbrajanjem duljina obaju dijelova putanje:\n\n$$s=30\\ \\text{m}+40\\ \\text{m}=\\textcolor{green}{70\\ \\text{m}}.$$\n\nPomak spaja ulaz s konačnim položajem, a ne prati skretanje kolica. Njegov iznos označimo slovom \\(d\\); on je hipotenuza pravokutnog trokuta s katetama od 30 i 40 metara. Ovdje koristimo **Pitagorin poučak** iz matematike:\n\n$$\\begin{aligned}d^2&=(30\\ \\text{m})^2+(40\\ \\text{m})^2 && /\\ \\sqrt{\\phantom{x}}\\\\ d&=\\sqrt{900+1600}\\ \\text{m}=\\textcolor{green}{50\\ \\text{m}}.\\end{aligned}$$\n\nPomak je usmjeren \\(\\textcolor{green}{\\text{od ulaza prema konačnom položaju, prema sjeveroistoku}}\\). Primijeti da je put dulji od iznosa pomaka: kolica su išla preko ugla, dok strelica pomaka izravno spaja početak i kraj.\n\n## ⏱️ Cijelo putovanje ulazi u prosjek\n\n**b) Koliki su ukupni put, pomak i prosječna brzina od prvog polaska u a) do kraja mirovanja? Je li prosječna brzina nula zato što su kolica ponovno kod ulaza?**\n\nZadano je da je odlazak trajao \\(50\\ \\text{s}\\), povratak istom putanjom \\(80\\ \\text{s}\\), a mirovanje kod ulaza još \\(10\\ \\text{s}\\).\n\n**Prosječna brzina** govori koliko bi metara u svakoj sekundi tijelo trebalo prelaziti da jednolikim tempom prijeđe isti ukupni put u istom ukupnom vremenu. Zato u vrijeme putovanja ulaze i stajanja, baš kao što čekanje usput produljuje vrijeme dostave. Jedinica **metar u sekundi**, \\(\\text{m/s}\\), govori koliko se metara prosječno prijeđe u jednoj sekundi.\n\nU **knjižici formula, str. 2**, poglavlje *Kinematika*, nalazi se formula:\n\n$$v=\\frac{\\Delta s}{\\Delta t}.$$\n\nOvdje je \\(\\Delta s\\) ukupni prijeđeni put, a \\(\\Delta t\\) ukupno proteklo vrijeme; znak \\(\\Delta\\) označava promjenu ili razliku. Duljine su već u metrima, a vremena u sekundama, pa pretvorbe nisu potrebne. Povratak dodaje još 70 metara puta, dok mirovanje dodaje samo vrijeme:\n\n$$\\Delta s=70\\ \\text{m}+70\\ \\text{m}=\\textcolor{green}{140\\ \\text{m}},$$\n\n$$\\Delta t=50\\ \\text{s}+80\\ \\text{s}+10\\ \\text{s}=140\\ \\text{s}.$$\n\nUvrštavanjem dobivamo:\n\n$$v_{\\text{prosj}}=\\frac{140\\ \\text{m}}{140\\ \\text{s}}=\\textcolor{green}{1\\ \\text{m/s}}.$$\n\nZamka je pomisliti da povratak poništava prijeđeni put. On poništava **pomak**, jer su početni i konačni položaj isti, ali prijeđeni metri i dalje ostaju zabilježeni:\n\n$$d=\\textcolor{green}{0\\ \\text{m}}.$$\n\nDakle, prosječna brzina nije nula: računamo je iz **puta**, a ne iz pomaka. Kad bi kolica svih 140 sekundi prelazila po jedan metar u sekundi, prešla bi upravo isti ukupni put od 140 metara.\n\n## 📈 Jednolika vožnja i grafovi\n\n**c) Koliki put kolica prijeđu i koji im je konačni položaj? Skiciraj grafove položaja i brzine o vremenu te označi površinu koja predstavlja put. Bi li pri dvostrukoj brzini graf položaja bio dvostruko strmiji? Mora li ukupna sila biti različita od nule?**\n\nZadani su stalna brzina \\(7{,}2\\ \\text{km/h}\\), trajanje nove vožnje \\(20\\ \\text{s}\\) i početni položaj \\(x_0=10\\ \\text{m}\\), uz pozitivan smjer prema istoku.\n\nKljučne riječi su **jednoliko po pravcu**: kolica ne mijenjaju ni iznos ni smjer brzine, pa u jednakim vremenskim intervalima prelaze jednake putove. Najprije brzinu pretvaramo u metre u sekundi; kilometar ima 1000 metara, a sat 3600 sekundi:\n\n$$7{,}2\\ \\text{km/h}=7{,}2\\cdot\\frac{1000\\ \\text{m}}{3600\\ \\text{s}}=\\frac{7{,}2}{3{,}6}\\ \\text{m/s}=2\\ \\text{m/s}.$$\n\nZa jednoliko gibanje formula za put slijedi iz formule za brzinu u **knjižici formula, str. 2**, poglavlje *Kinematika*. Formula \\(s=vt\\) nije ondje zasebno zapisana u tom obliku, ali se iz nje izvede u dva reda; ovdje vrijeme mjerimo od početka vožnje:\n\n$$\\begin{aligned}v&=\\frac{s}{t} && /\\ \\cdot t\\\\ vt&=s.\\end{aligned}$$\n\nSada uvrstimo brzinu i vrijeme:\n\n$$s=vt=2\\ \\text{m/s}\\cdot20\\ \\text{s}=\\textcolor{green}{40\\ \\text{m}}.$$\n\n**Položaj** je poput oznake na metarskoj traci uz hodnik: oznaka na kojoj počinjemo nije isto što i put koji ćemo prijeći. Budući da se kolica gibaju u pozitivnom smjeru, novi položaj dobivamo tako da početnom položaju dodamo prijeđeni put. Ta formula nije zapisana u knjižici, nego slijedi iz značenja položaja i upravo izvedenog izraza za put:\n\n$$x-x_0=s=vt,$$\n\n$$\\begin{aligned}x-x_0&=vt && /\\ +x_0\\\\ x&=x_0+vt.\\end{aligned}$$\n\nZato je konačni položaj:\n\n$$x=10\\ \\text{m}+2\\ \\text{m/s}\\cdot20\\ \\text{s}=\\textcolor{green}{50\\ \\text{m}}.$$\n\nZa **graf položaja o vremenu** na vodoravnu os stavi vrijeme u sekundama, a na okomitu položaj u metrima. Ucrtaj sljedeće točke i spoji ih pravcem; za **graf brzine o vremenu** koristi isti vremenski interval, a na okomitu os stavi brzinu u metrima u sekundi.\n\n| Vrijeme | Položaj | Brzina |\n|---|---|---|\n| \\(0\\ \\text{s}\\) | \\(10\\ \\text{m}\\) | \\(2\\ \\text{m/s}\\) |\n| \\(10\\ \\text{s}\\) | \\(30\\ \\text{m}\\) | \\(2\\ \\text{m/s}\\) |\n| \\(20\\ \\text{s}\\) | \\(50\\ \\text{m}\\) | \\(2\\ \\text{m/s}\\) |\n\nGraf \\(x(t)\\) jest **rastući pravac** od točke \\((0\\ \\text{s},10\\ \\text{m})\\) do točke \\((20\\ \\text{s},50\\ \\text{m})\\). Njegov **nagib** govori za koliko se položaj promijeni u jednoj sekundi, pa je jednak brzini. To slijedi iz izraza \\(x-x_0=vt\\), a za naš pravac iznosi:\n\n$$\\frac{x-x_0}{t}=\\frac{50\\ \\text{m}-10\\ \\text{m}}{20\\ \\text{s}}=2\\ \\text{m/s}.$$\n\nPri dvostrukoj brzini, \\(4\\ \\text{m/s}\\), položaj bi se u svakoj sekundi mijenjao dvostruko više, pa bi uz iste skale osi pravac bio \\(\\textcolor{green}{\\text{dvostruko strmiji}}\\). Nasuprot tome, **vodoravan graf položaja** značio bi mirovanje: vrijeme prolazi, ali položaj ostaje isti.\n\nGraf \\(v(t)\\) jest **vodoravan pravac** na visini \\(2\\ \\text{m/s}\\), jer se brzina ne mijenja. Osjenčaj pravokutnik između tog pravca i vremenske osi, od 0 do 20 sekundi. Njegova površina predstavlja prijeđeni put jer je umnožak brzine i vremena:\n\n$$s=2\\ \\text{m/s}\\cdot20\\ \\text{s}=40\\ \\text{m}.$$\n\nU ovoj je vožnji brzina pozitivna cijelo vrijeme, pa ta površina predstavlja i pomak u pozitivnom smjeru. Općenito, predznačena površina grafa brzine daje pomak, dok za put zbrajamo iznose površina; ovdje su put i iznos pomaka jednaki jer nema povratka.\n\n**Akceleracija** govori koliko se brzina promijeni u jednoj sekundi — primjerice, dok kolica ubrzavaju pri polasku. Naziv se često povezuje s ubrzavanjem, ali akceleracija može opisivati i usporavanje ili promjenu smjera. U **knjižici formula, str. 2**, poglavlje *Kinematika*, stoji:\n\n$$a=\\frac{\\Delta v}{\\Delta t}.$$\n\nTijekom promatrane jednolike vožnje nema promjene brzine, pa dobivamo:\n\n$$a=\\frac{0\\ \\text{m/s}}{20\\ \\text{s}}=\\textcolor{green}{0\\ \\text{m/s}^2}.$$\n\n**Sila** opisuje guranje ili povlačenje, a **ukupna sila** zajednički je učinak svih sila na tijelo. U **knjižici formula, str. 2**, poglavlje *Dinamika*, nalazi se veza akceleracije, ukupne sile i mase tijela:\n\n$$a=\\frac{F}{m}.$$\n\nMasu kolica označavamo slovom \\(m\\), ali njezin nam iznos ovdje ne treba. Preuređivanjem formule dobivamo:\n\n$$\\begin{aligned}a&=\\frac{F}{m} && /\\ \\cdot m\\\\ ma&=F.\\end{aligned}$$\n\nBudući da je akceleracija nula, ukupna sila također je \\(\\textcolor{green}{F=0\\ \\text{N}}\\), gdje je njutn, \\(\\text{N}\\), jedinica sile. To ne znači da pojedinačnih sila nema: pogonska sila može se poništavati sa silama otpora. Za održavanje stalne brzine nije potrebna nenulta **ukupna** sila; ona bi mijenjala brzinu.\n\n## ✅ Rezultati\n\na) Put: \\(70\\ \\text{m}\\); iznos pomaka: \\(50\\ \\text{m}\\), prema sjeveroistoku; kutija miruje prema platformi, a giba se prema ulazu.\n\nb) Ukupni put: \\(140\\ \\text{m}\\); pomak: \\(0\\ \\text{m}\\); prosječna brzina: \\(1\\ \\text{m/s}\\), nije nula.\n\nc) Brzina: \\(2\\ \\text{m/s}\\); put: \\(40\\ \\text{m}\\); konačni položaj: \\(50\\ \\text{m}\\); graf položaja je rastući pravac, graf brzine vodoravan; dvostruka brzina daje dvostruki nagib; \\(a=0\\ \\text{m/s}^2\\), \\(F=0\\ \\text{N}\\).", "ref": {"a": "Put je 70 m, iznos pomaka 50 m prema sjeveroistoku; kutija miruje u odnosu na platformu, a giba se u odnosu na ulaz.", "b": "Ukupni put je 140 m, pomak 0 m, a prosječna brzina 1 m/s, dakle nije nula.", "c": "Brzina je 2 m/s, put 40 m, konačni položaj 50 m, akceleracija 0 m/s² i ukupna sila 0 N; graf položaja je rastući pravac, graf brzine vodoravan, a dvostruka brzina daje dvostruki nagib grafa položaja."}, "marks": [{"kind": "sitnica", "text": "prema sjeveroistoku", "note": "nije točno sjeveroistok (45°), nego oko 53° od istoka prema sjeveru"}, {"kind": "sitnica", "text": "Mora li tijekom ove jednolike vožnje", "note": "c) je pretrpan: put, položaj, dva grafa, nagib i sila u jednom podzadatku"}]}, {"id": "B01.03-1", "title": "B01.03 Akceleracija i jednoliko ubrzano gibanje — varijacija 1", "who": "Sol medium (predložak)", "task": "a) Automobil na ravnoj ispitnoj stazi kreće iz mirovanja i jednoliko ubrzava. Nakon \\(5 \\ \\text{s}\\) njegova je brzina \\(36 \\ \\text{km/h}\\). Kolika je akceleracija automobila?\n\nb) Automobil nastavlja voziti po istom pravcu s istom akceleracijom. Kolika mu je brzina i koliki je ukupni prijeđeni put nakon \\(10 \\ \\text{s}\\) od polaska? Koliko je puta taj put veći od puta prijeđenog u prvih \\(5 \\ \\text{s}\\)?\n\nc) Od položaja u kojem se nalazi nakon tih \\(10 \\ \\text{s}\\), automobil prijeđe još \\(125 \\ \\text{m}\\), i dalje s istom akceleracijom. Kolika mu je brzina na kraju tog dodatnog dijela puta?", "expl": "## 🚗 Promjena brzine\n**Kolika je akceleracija automobila?**\n\nZadano je da automobil kreće iz mirovanja i za \\(5 \\ \\text{s}\\) jednoliko ubrza do \\(36 \\ \\text{km/h}\\).\n\n**Akceleracija** govori koliko se brzina promijeni u jedinici vremena: zamisli da svake sekunde pogledaš brzinomjer i usporediš očitanje s prethodnim. Zove se i **ubrzanje** jer opisuje promjenu brzine, a ne samu brzinu. Ključna riječ je **jednoliko**: akceleracija je stalna, pa brzina u svakoj sekundi poraste za jednak iznos.\n\nU **knjižici formula, str. 2**, poglavlje *Kinematika*, nalazi se:\n\n$$a = \\frac{\\Delta v}{\\Delta t}$$\n\nOznaka \\(\\Delta v\\) znači razliku konačne i početne brzine, a \\(\\Delta t\\) proteklo vrijeme. Prvo jedna zamka: brzinu u kilometrima na sat ne smijemo izravno uvrstiti uz vrijeme u sekundama, jer jedinice tada nisu usklađene. Zato je pretvaramo:\n\n$$36 \\ \\text{km/h} = \\frac{36}{3{,}6} \\ \\text{m/s} = 10 \\ \\text{m/s}$$\n\nPočetna je brzina nula jer automobil kreće iz mirovanja. Uvrštavamo:\n\n$$a = \\frac{10 \\ \\text{m/s} - 0 \\ \\text{m/s}}{5 \\ \\text{s}} = \\textcolor{green}{2 \\ \\text{m/s}^2}$$\n\nJedinica **metar u sekundi na kvadrat** nastaje dijeljenjem promjene brzine vremenom. Ovdje rezultat znači da brzina svake sekunde poraste za \\(2 \\ \\text{m/s}\\), pa za pet sekundi poraste za očekivanih \\(10 \\ \\text{m/s}\\).\n\n## 📈 Dvostruko vrijeme, četverostruki put\n**Kolika mu je brzina i koliki je ukupni prijeđeni put nakon \\(10 \\ \\text{s}\\) od polaska? Koliko je puta taj put veći od puta prijeđenog u prvih \\(5 \\ \\text{s}\\)?**\n\nZadano je ukupno vrijeme \\(t = 10 \\ \\text{s}\\), početna brzina \\(v_0 = 0 \\ \\text{m/s}\\) i nepromijenjena akceleracija \\(a = 2 \\ \\text{m/s}^2\\).\n\nPri **jednoliko ubrzanom gibanju** brzina raste poput stanja na računu na koji svake sekunde dodamo jednak iznos: početnoj vrijednosti pribrajamo porast tijekom proteklog vremena. U **knjižici formula, str. 2**, poglavlje *Kinematika*, nalazi se formula za brzinu:\n\n$$v = v_0 + at$$\n\nSve su veličine već u odgovarajućim jedinicama, pa pretvorbe nisu potrebne. Uvrštavanjem dobivamo:\n\n$$v = 0 \\ \\text{m/s} + 2 \\ \\text{m/s}^2 \\cdot 10 \\ \\text{s} = \\textcolor{green}{20 \\ \\text{m/s}}$$\n\nSad **put**. Zamka je pomnožiti konačnu brzinu s cijelim vremenom: automobil nije svih deset sekundi vozio tom brzinom, nego je do nje tek postupno došao. U **knjižici formula, str. 2**, poglavlje *Kinematika*, nalazi se:\n\n$$s = v_0 t + \\frac{1}{2}at^2$$\n\nPrvi član opisuje put koji bi automobil prešao da je zadržao početnu brzinu, a drugi dodatni put zbog ubrzavanja. Faktor jedne polovice možemo razumjeti preko grafa brzine: pri polasku iz mirovanja površina ispod grafa je trokut, a ne pravokutnik.\n\n$$s_{10} = 0 \\ \\text{m/s} \\cdot 10 \\ \\text{s} + \\frac{1}{2} \\cdot 2 \\ \\text{m/s}^2 \\cdot (10 \\ \\text{s})^2 = \\textcolor{green}{100 \\ \\text{m}}$$\n\nZa usporedbu istom formulom računamo put u prvih pet sekundi. Početna brzina i akceleracija ostaju iste:\n\n$$s_5 = \\frac{1}{2} \\cdot 2 \\ \\text{m/s}^2 \\cdot (5 \\ \\text{s})^2 = 25 \\ \\text{m}$$\n\n$$\\frac{s_{10}}{s_5} = \\frac{100 \\ \\text{m}}{25 \\ \\text{m}} = \\textcolor{green}{4}$$\n\nDakle, za **dvostruko vrijeme** automobil prijeđe **četverostruki put**, jer pri polasku iz mirovanja put ovisi o kvadratu vremena. To ima smisla: u drugoj polovici vožnje automobil je brži nego u prvoj, pa ukupni put nije samo dvostruk.\n\n## 🛣️ Brzina bez računanja vremena\n**Kolika mu je brzina na kraju tog dodatnog dijela puta?**\n\nZa dodatni dio puta zadano je \\(s = 125 \\ \\text{m}\\), početna brzina tog dijela \\(v_0 = 20 \\ \\text{m/s}\\) i ista akceleracija \\(a = 2 \\ \\text{m/s}^2\\).\n\nPrvo jedna zamka: **početna brzina** odnosi se na početak dijela gibanja koji upravo promatramo. Automobil je na početku cijele vožnje mirovao, ali na početku dodatnih 125 metara već vozi brzinom iz b), pa ovdje početna brzina nije nula.\n\nVrijeme tog dijela vožnje nije zadano i ne moramo ga računati. U **knjižici formula, str. 2**, poglavlje *Kinematika*, nalazi se veza brzine, akceleracije i puta **bez vremena**:\n\n$$v^2 = v_0^2 + 2as$$\n\nDa bismo dobili brzinu, korjenujemo obje strane. Uzimamo pozitivan korijen jer automobil nastavlja voziti u istom smjeru:\n\n$$\\begin{aligned} v^2 &= v_0^2 + 2as && /\\ \\sqrt{\\phantom{x}} \\\\ v &= \\sqrt{v_0^2 + 2as} \\end{aligned}$$\n\nPodaci su već u metrima i sekundama, pa pretvorbe nisu potrebne. Uvrštavamo:\n\n$$v = \\sqrt{(20 \\ \\text{m/s})^2 + 2 \\cdot 2 \\ \\text{m/s}^2 \\cdot 125 \\ \\text{m}} = \\sqrt{900 \\ \\text{m}^2/\\text{s}^2} = \\textcolor{green}{30 \\ \\text{m/s}}$$\n\nBrzina je veća nego na početku dodatnog dijela puta, što očekujemo jer automobil i dalje ubrzava. Porast s 20 na 30 metara u sekundi pri ovoj akceleraciji traje pet sekundi; u tom vremenu prijeđeni put od 125 metara odgovara prosječnoj brzini od 25 metara u sekundi.\n\n## ✅ Rezultati\n a) Akceleracija je \\(\\textcolor{green}{2 \\ \\text{m/s}^2}\\).\n\n b) Brzina je \\(\\textcolor{green}{20 \\ \\text{m/s}}\\), ukupni put \\(\\textcolor{green}{100 \\ \\text{m}}\\), a taj je put **4 puta veći** nego u prvih pet sekundi.\n\n c) Konačna brzina je \\(\\textcolor{green}{30 \\ \\text{m/s}}\\).", "ref": {"a": "2 m/s²", "b": "20 m/s; 100 m; put je 4 puta veći nego u prvih 5 s.", "c": "30 m/s"}, "marks": []}, {"id": "B01.04-1", "title": "B01.04 Usporavanje i grafovi ubrzanog gibanja — varijacija 1", "who": "Sol medium (predložak)", "task": "a) Automobil na ravnoj cesti vozi brzinom \\(72\\ \\text{km/h}\\), a zatim počinje jednoliko kočiti tako da mu se brzina svake sekunde smanji za \\(4\\ \\text{m/s}\\). Pozitivan smjer odaberemo u smjeru vožnje, a vrijeme mjerimo od početka kočenja. Koliko traje kočenje do zaustavljanja? Skiciraj graf \\(a(t)\\) tijekom kočenja i iz njegove površine odredi promjenu brzine.\n\nb) Za isto kočenje skiciraj graf \\(v(t)\\). Što predstavlja njegov nagib i koliki pomak automobil napravi do zaustavljanja, prema površini ispod grafa?\n\nc) Nakon zaustavljanja taj automobil ostaje mirovati. Početni položaj pri početku kočenja označimo nulom. Skiciraj graf \\(x(t)\\) tijekom prvih \\(7\\ \\text{s}\\) i objasni što njegovo sve blaže uspinjanje govori o brzini. Bi li bilo ispravno nastaviti krivulju tako da se nakon zaustavljanja položaj smanjuje?", "expl": "## 🛑 Kočenje do mirovanja\n\n**a) Koliko traje kočenje do zaustavljanja? Skiciraj graf \\(a(t)\\) tijekom kočenja i iz njegove površine odredi promjenu brzine.**\n\nZadana je početna brzina \\(72\\ \\text{km/h}\\), koja se svake sekunde smanjuje za \\(4\\ \\text{m/s}\\), uz pozitivan smjer u smjeru vožnje.\n\n**Jednoliko usporeno gibanje** znači da tijelo u jednakim vremenskim razmacima gubi jednake iznose brzine, poput automobila koji svake sekunde uspori jednako. Riječ **jednoliko** odnosi se na stalnu akceleraciju, a **usporeno** na smanjivanje iznosa brzine. Akceleracija je zato suprotna brzini.\n\nPrvo jedna **zamka**: zadani iznos smanjivanja brzine nije pozitivna akceleracija u odabranom smjeru. Dok automobil vozi u pozitivnom smjeru, njegova je akceleracija negativna. Prije računanja pretvorimo brzinu:\n\n$$v_0 = 72\\ \\text{km/h} = \\frac{72}{3{,}6}\\ \\text{m/s} = 20\\ \\text{m/s}, \\qquad a = -4\\ \\text{m/s}^2.$$\n\nU **knjižici formula, str. 2**, poglavlje *Kinematika*, nalazi se:\n\n$$v = v_0 + at.$$\n\nAutomobil se zaustavlja kada je brzina nula. Vrijeme zaustavljanja izdvojimo korak po korak:\n\n$$\\begin{aligned} 0 &= v_0 + at && /\\; -v_0 \\\\ -v_0 &= at && /\\; :a \\\\ t &= -\\frac{v_0}{a}. \\end{aligned}$$\n\n$$t = -\\frac{20\\ \\text{m/s}}{-4\\ \\text{m/s}^2} = \\textcolor{green}{5\\ \\text{s}}.$$\n\n**Graf akceleracije** prikazuje koliko se brzo mijenja brzina u svakom trenutku. Budući da je akceleracija stalna, skica je **vodoravna dužina** na vrijednosti \\(-4\\ \\text{m/s}^2\\), od početka kočenja do \\(5\\ \\text{s}\\); pri stalnoj pozitivnoj akceleraciji takva bi dužina bila iznad vremenske osi.\n\n**Predznačena površina** između grafa i vremenske osi daje promjenu brzine: površinu ispod osi računamo negativno. To slijedi iz formule u **knjižici formula, str. 2**, poglavlje *Kinematika*:\n\n$$\\begin{aligned} a &= \\frac{\\Delta v}{\\Delta t} && /\\; \\cdot\\Delta t \\\\ \\Delta v &= a\\Delta t. \\end{aligned}$$\n\nPravokutnik između grafa i osi ima širinu \\(5\\ \\text{s}\\), pa je:\n\n$$\\Delta v = (-4\\ \\text{m/s}^2)\\cdot 5\\ \\text{s} = \\textcolor{green}{-20\\ \\text{m/s}}.$$\n\nPromjena je negativna jer je automobil izgubio početnih \\(20\\ \\text{m/s}\\). Provjera je jednostavna: pet sekundi po \\(4\\ \\text{m/s}\\) smanjenja upravo dovodi do mirovanja.\n\n## 📉 Brzina i prijeđeni pomak\n\n**b) Za isto kočenje skiciraj graf \\(v(t)\\). Što predstavlja njegov nagib i koliki pomak automobil napravi do zaustavljanja, prema površini ispod grafa?**\n\nIz a) znamo da brzina pada s \\(20\\ \\text{m/s}\\) na nulu tijekom \\(5\\ \\text{s}\\), uz stalnu akceleraciju \\(-4\\ \\text{m/s}^2\\).\n\n**Graf brzine** ovdje je ravna dužina od točke s vremenom \\(0\\ \\text{s}\\) i brzinom \\(20\\ \\text{m/s}\\) do točke s vremenom \\(5\\ \\text{s}\\) i brzinom nula. Jednaka promjena brzine svake sekunde daje pravac, kao što jednako podizanje svakim korakom daje ravnu kosinu.\n\n**Nagib** govori koliko se okomita vrijednost promijeni po jedinici vodoravne vrijednosti. Na ovom grafu to je promjena brzine podijeljena vremenom, dakle upravo **akceleracija**, prema formuli iz **knjižice formula, str. 2**, poglavlje *Kinematika*:\n\n$$a = \\frac{\\Delta v}{\\Delta t} = \\frac{0\\ \\text{m/s}-20\\ \\text{m/s}}{5\\ \\text{s}} = -4\\ \\text{m/s}^2.$$\n\n**Površina ispod grafa brzine daje pomak.** Za stalnu akceleraciju možemo to provjeriti iz formula u **knjižici formula, str. 2**, poglavlje *Kinematika*:\n\n$$s = v_0t + \\frac12 at^2, \\qquad v = v_0 + at.$$\n\nFormule za površinu trapeza kao pomak nema u knjižici, ali se iz njih izvede u dva reda. U ovoj vožnji nema promjene smjera, pa je pomak jednak putu:\n\n$$\\begin{aligned} s &= v_0t + \\frac12(v-v_0)t \\\\ s &= \\frac{v_0+v}{2}\\,t. \\end{aligned}$$\n\nOvdje trapez postaje **trokut**, jer je konačna brzina nula. Sve su jedinice već u metrima i sekundama, pa računamo njegovu površinu:\n\n$$\\Delta x = \\frac{5\\ \\text{s}\\cdot20\\ \\text{m/s}}{2} = \\textcolor{green}{50\\ \\text{m}}.$$\n\nPrimijeti da je to upola manje od pomaka pri vožnji stalnom početnom brzinom tijekom istih pet sekundi. Graf kočenja zauzima polovicu pravokutnika koji bi predstavljao takvu vožnju.\n\n## 📈 Položaj koji se sve sporije mijenja\n\n**c) Skiciraj graf \\(x(t)\\) tijekom prvih \\(7\\ \\text{s}\\) i objasni što njegovo sve blaže uspinjanje govori o brzini. Bi li bilo ispravno nastaviti krivulju tako da se nakon zaustavljanja položaj smanjuje?**\n\nPočetni položaj je nula, automobil se zaustavlja nakon \\(5\\ \\text{s}\\) na položaju \\(50\\ \\text{m}\\), a zatim ostaje mirovati.\n\n**Graf položaja** pokazuje gdje se automobil nalazi u pojedinom trenutku. Tijekom kočenja položaj još raste, ali sve sporije: u svakoj sljedećoj sekundi automobil prijeđe manje nego u prethodnoj.\n\nU **knjižici formula, str. 2**, poglavlje *Kinematika*, nalazi se formula za put:\n\n$$s = v_0t + \\frac12 at^2.$$\n\nBudući da krećemo iz položaja nula i do zaustavljanja ne mijenjamo smjer, položaj je jednak tom putu. Za taj dio gibanja dobivamo:\n\n$$x(t) = (20\\ \\text{m/s})t + \\frac12(-4\\ \\text{m/s}^2)t^2, \\qquad 0\\leq t\\leq5\\ \\text{s}.$$\n\nZbog člana s kvadratom vremena graf je dio **parabole**. Za skicu označi početak i završetak kočenja te, primjerice, položaj nakon dvije sekunde:\n\n$$x(2\\ \\text{s}) = (20\\ \\text{m/s})(2\\ \\text{s}) + \\frac12(-4\\ \\text{m/s}^2)(2\\ \\text{s})^2 = 32\\ \\text{m}.$$\n\n**Tangenta** je pravac koji uz krivulju pokazuje njezin lokalni smjer, poput ravnala položenog uz mali dio zavoja. Njezin nagib na grafu položaja daje **trenutačnu brzinu**: što je graf strmiji, položaj se brže mijenja. Ovdje pozitivan nagib opada do nule, pa automobil usporava; za gibanje u pozitivnom smjeru rastući pozitivan nagib značio bi ubrzavanje.\n\nZamka je **nastaviti istu parabolu nakon zaustavljanja**. Nastavak bi imao negativan nagib, odnosno opisivao bi automobil koji kreće natrag, a ne automobil koji miruje; zato formula s istom negativnom akceleracijom za ovo kočenje vrijedi samo do zaustavljanja.\n\nOd \\(5\\ \\text{s}\\) do \\(7\\ \\text{s}\\) nacrtaj vodoravnu dužinu:\n\n$$x = \\textcolor{green}{50\\ \\text{m}}, \\qquad 5\\ \\text{s}\\leq t\\leq7\\ \\text{s}.$$\n\n**Graf je rastući dio parabole koji se izravnava, a zatim vodoravna dužina, ne silazna krivulja.** Vodoravan završetak potvrđuje mirovanje: položaj se više ne mijenja, a brzina i akceleracija tada su nula.\n\n## ✅ Rezultati\n\na) Zaustavljanje nakon \\(5\\ \\text{s}\\); graf akceleracije je vodoravan na \\(-4\\ \\text{m/s}^2\\), a promjena brzine je \\(-20\\ \\text{m/s}\\).\n\nb) Pomak je \\(50\\ \\text{m}\\); graf brzine je padajući pravac nagiba \\(-4\\ \\text{m/s}^2\\).\n\nc) Položaj raste po paraboli sa sve manjim nagibom do \\(50\\ \\text{m}\\), a od \\(5\\ \\text{s}\\) ostaje stalan, pa silazni nastavak nije ispravan.", "ref": {"a": "5 s; promjena brzine −20 m/s.", "b": "50 m; nagib grafa brzine −4 m/s².", "c": "Graf položaja raste po paraboli sa sve manjim nagibom do 50 m, a od 5 s postaje vodoravan jer automobil miruje, pa silazni nastavak nije ispravan."}, "marks": []}, {"id": "B01.05-1", "title": "B01.05 Promjena smjera, slobodni pad i rješavanje zadataka — varijacija 1", "who": "Sol medium (predložak)", "task": "a) Lopticu A bacimo okomito uvis s tla. Njezin graf brzine \\(v(t)\\) jest pravac koji prolazi kroz točke \\((0\\ \\text{s},\\ 20\\ \\text{m/s})\\) i \\((3\\ \\text{s},\\ -10\\ \\text{m/s})\\); pozitivan smjer je prema gore. Kada loptica mijenja smjer i zašto tada njezina akceleracija nije nula? Iz površina između grafa i vremenske osi odredi put i pomak tijekom prve \\(3\\ \\text{s}\\). Zanemari otpor zraka i uzmi \\(g=10\\ \\text{m/s}^2\\) u svim podzadatcima.\n\nb) Ponovimo bacanje loptice A jednakom početnom brzinom. Istodobno drugu lopticu B ispustimo iz mirovanja s balkona na visini \\(60\\ \\text{m}\\), točno iznad mjesta bacanja loptice A. Koliku udaljenost loptica B prijeđe u prve \\(2\\ \\text{s}\\) i kolika joj je tada brzina?\n\nc) U pokusu iz b), nakon koliko vremena od istodobnog puštanja i bacanja dolazi do sudara loptica i na kojoj visini iznad tla?", "expl": "## 📈 Promjena smjera i površine\n\n**Kada loptica mijenja smjer i zašto tada njezina akceleracija nije nula? Iz površina između grafa i vremenske osi odredi put i pomak tijekom prve \\(3\\ \\text{s}\\).**\n\nZadano je da brzina loptice A pada s \\(20\\ \\text{m/s}\\) na \\(-10\\ \\text{m/s}\\) u \\(3\\ \\text{s}\\), uz pozitivan smjer prema gore. Sve su veličine već u **SI jedinicama**, pa pretvorbe nisu potrebne.\n\n**Predznak brzine** govori kamo se loptica kreće: pozitivan znači prema gore, a negativan prema dolje. Budući da je graf pravac, brzina se mijenja jednako u svakoj sekundi, odnosno akceleracija je stalna. U **knjižici formula, str. 2**, poglavlje *Kinematika*, nalazi se:\n\n$$a=\\frac{\\Delta v}{\\Delta t}$$\n\n$$a=\\frac{-10\\ \\text{m/s}-20\\ \\text{m/s}}{3\\ \\text{s}}=-10\\ \\text{m/s}^2$$\n\nTo je **hitac uvis**: loptica na početku ima brzinu prema gore, ali joj je akceleracija cijelo vrijeme usmjerena prema dolje. Iznos te akceleracije jest \\(g\\); u **knjižici formula, str. 5**, među konstantama piše da u zadatcima treba uzeti \\(10\\ \\text{m/s}^2\\). Zato je na našoj osi \\(a=-g\\).\n\nZa trenutak promjene smjera trebamo vezu brzine i vremena. U **knjižici formula, str. 2**, poglavlje *Kinematika*, nalazi se:\n\n$$v=v_0+at$$\n\nNa vrhu putanje brzina je nula, pa vrijeme izdvajamo korak po korak:\n\n$$\\begin{aligned}0&=v_0+at && /\\ -v_0\\\\-v_0&=at && /\\ :a\\\\t&=-\\frac{v_0}{a}\\end{aligned}$$\n\n$$t=-\\frac{20\\ \\text{m/s}}{-10\\ \\text{m/s}^2}=\\textcolor{green}{2\\ \\text{s}}$$\n\n**Prvo jedna zamka:** nulta brzina ne znači nultu akceleraciju. Loptica je na vrhu samo trenutačno zaustavljena, ali Zemlja je i dalje privlači; akceleracija ostaje \\(\\textcolor{green}{-10\\ \\text{m/s}^2}\\). Ovdje brzina prolazi kroz nulu i mijenja predznak, pa loptica doista **mijenja smjer**.\n\n**Put** je ukupna prijeđena udaljenost, kao duljina cijele šetnje, a **pomak** govori koliko smo se i u kojem smjeru udaljili od početnog mjesta. Zato se površine ispod vremenske osi za pomak **oduzimaju**, dok se za put zbrajaju njihovi **apsolutni iznosi**. To je geometrijsko čitanje grafa: površina trokuta jednaka je polovini umnoška osnovice i visine.\n\nOd početka do \\(2\\ \\text{s}\\) trokut je iznad osi, a od \\(2\\ \\text{s}\\) do \\(3\\ \\text{s}\\) ispod nje. Njihovi iznosi su:\n\n$$P_+=\\frac{2\\ \\text{s}\\cdot20\\ \\text{m/s}}{2}=20\\ \\text{m}$$\n\n$$P_-=\\frac{(3-2)\\ \\text{s}\\cdot10\\ \\text{m/s}}{2}=5\\ \\text{m}$$\n\n$$\\text{put}=20\\ \\text{m}+5\\ \\text{m}=\\textcolor{green}{25\\ \\text{m}}$$\n\n$$\\Delta x=20\\ \\text{m}-5\\ \\text{m}=\\textcolor{green}{+15\\ \\text{m}}$$\n\nPrimijeti: loptica se popela \\(20\\ \\text{m}\\), a zatim spustila \\(5\\ \\text{m}\\). Prešla je ukupno \\(25\\ \\text{m}\\), ali je završila samo \\(15\\ \\text{m}\\) iznad mjesta bacanja.\n\n## 🪂 Slobodni pad druge loptice\n\n**Koliku udaljenost loptica B prijeđe u prve \\(2\\ \\text{s}\\) i kolika joj je tada brzina?**\n\nZadano je da loptica B kreće iz mirovanja s visine \\(60\\ \\text{m}\\), a promatramo prvih \\(2\\ \\text{s}\\) uz \\(g=10\\ \\text{m/s}^2\\).\n\n**Slobodni pad** je gibanje u kojem na tijelo djeluje samo gravitacija, kao pri ispuštanju kamenčića ako zanemarimo otpor zraka. Zove se slobodni jer tijelo nije oslonjeno ni pridržavano. Za račun pada loptice B privremeno biramo pozitivan smjer **prema dolje**, pa su \\(v_0=0\\) i \\(a=+g\\); ta promjena osi vrijedi samo u ovom podzadatku.\n\nTražimo brzinu i prijeđenu udaljenost nakon poznatog vremena. U **knjižici formula, str. 2**, poglavlje *Kinematika*, nalaze se upravo formule koje povezuju te veličine:\n\n$$v=v_0+at$$\n\n$$s=v_0t+\\frac12at^2$$\n\nPosebne formule za pad iz mirovanja nema u knjižici, ali se iz nje izvede u dva reda: uvrstimo nultu početnu brzinu i akceleraciju \\(g\\). Oznakom \\(h\\) ovdje označavamo **prijeđenu udaljenost prema dolje**, a ne visinu iznad tla.\n\n$$v=0+gt=gt$$\n\n$$h=0\\cdot t+\\frac12gt^2=\\frac12gt^2$$\n\nPodaci su već u sekundama i metrima, pa pretvorbe nisu potrebne. Uvrštavanjem dobivamo:\n\n$$h=\\frac12\\cdot10\\ \\text{m/s}^2\\cdot(2\\ \\text{s})^2=\\textcolor{green}{20\\ \\text{m}}$$\n\n$$v=10\\ \\text{m/s}^2\\cdot2\\ \\text{s}=\\textcolor{green}{20\\ \\text{m/s}\\ \\text{prema dolje}}$$\n\nNakon dvije sekunde loptica B još je \\(40\\ \\text{m}\\) iznad tla. Brzina joj svake sekunde naraste za \\(10\\ \\text{m/s}\\), što je upravo značenje zadane akceleracije.\n\n## 🎯 Jednaki položaji pri sudaru\n\n**U pokusu iz b), nakon koliko vremena od istodobnog puštanja i bacanja dolazi do sudara loptica i na kojoj visini iznad tla?**\n\nZadano je da A kreće s tla brzinom \\(20\\ \\text{m/s}\\) prema gore, a B istodobno kreće iz mirovanja s visine \\(60\\ \\text{m}\\).\n\nSad za **obje loptice biramo istu os**: početak je na tlu, a pozitivan smjer prema gore. Zato su početni položaji \\(x_{A0}=0\\) i \\(x_{B0}=60\\ \\text{m}\\), početne brzine \\(v_{A0}=+20\\ \\text{m/s}\\) i \\(v_{B0}=0\\), a obje akceleracije \\(a=-10\\ \\text{m/s}^2\\). Sve su jedinice već usklađene.\n\n**Zamka je uspoređivati prijeđene putove umjesto položaja.** Loptice kreću s različitih visina, pa jednaki putovi ne bi značili sudar. **Uvjet susreta** jest da u istom trenutku imaju jednak položaj na istoj vertikali.\n\nZa položaj koristimo formulu iz **knjižice formula, str. 2**, poglavlje *Kinematika*:\n\n$$s=v_0t+\\frac12at^2$$\n\nPri odabranom smjeru osi ovu formulu primjenjujemo na **predznačeni pomak**, odnosno \\(s=x-x_0\\), a ne na ukupni put nakon promjene smjera. Formule za položaj nema u knjižici, ali se iz nje izvede u dva reda:\n\n$$\\begin{aligned}x-x_0&=v_0t+\\frac12at^2 && /\\ +x_0\\\\x&=x_0+v_0t+\\frac12at^2\\end{aligned}$$\n\nUvrstimo podatke za svaku lopticu, koristeći zajedničko vrijeme od početka pokusa:\n\n$$x_A=(20\\ \\text{m/s})t-(5\\ \\text{m/s}^2)t^2$$\n\n$$x_B=60\\ \\text{m}-(5\\ \\text{m/s}^2)t^2$$\n\nSada postavimo **jednake položaje** i riješimo jednadžbu:\n\n$$\\begin{aligned}x_A&=x_B\\\\(20\\ \\text{m/s})t-(5\\ \\text{m/s}^2)t^2&=60\\ \\text{m}-(5\\ \\text{m/s}^2)t^2 && /\\ +(5\\ \\text{m/s}^2)t^2\\\\(20\\ \\text{m/s})t&=60\\ \\text{m} && /\\ :(20\\ \\text{m/s})\\\\t&=\\textcolor{green}{3\\ \\text{s}}\\end{aligned}$$\n\nVisinu sudara dobijemo uvrštavanjem tog vremena u položaj bilo koje loptice:\n\n$$x_A=20\\ \\text{m/s}\\cdot3\\ \\text{s}-5\\ \\text{m/s}^2\\cdot(3\\ \\text{s})^2=\\textcolor{green}{15\\ \\text{m}}$$\n\nProvjera drugom lopticom daje \\(x_B=60\\ \\text{m}-45\\ \\text{m}=15\\ \\text{m}\\). To se slaže i s pomakom loptice A iz a): nakon tri sekunde ona je \\(15\\ \\text{m}\\) iznad tla, gdje se sada sudara s lopticom B.\n\n## ✅ Rezultati\n\na) Promjena smjera nakon \\(2\\ \\text{s}\\); akceleracija i tada iznosi \\(-10\\ \\text{m/s}^2\\), jer gravitacija i dalje djeluje; put je \\(25\\ \\text{m}\\), a pomak \\(+15\\ \\text{m}\\).\n\nb) Loptica B prijeđe \\(20\\ \\text{m}\\), a brzina joj je \\(20\\ \\text{m/s}\\) prema dolje.\n\nc) Loptice se sudare nakon \\(3\\ \\text{s}\\), na visini \\(15\\ \\text{m}\\) iznad tla.", "ref": {"a": "Promjena smjera: 2 s; akceleracija i tada: −10 m/s² jer gravitacija i dalje djeluje; put: 25 m; pomak: +15 m.", "b": "Prijeđena udaljenost: 20 m; brzina: 20 m/s prema dolje.", "c": "Vrijeme do sudara: 3 s; visina sudara: 15 m iznad tla."}, "marks": []}, {"id": "B03.01-1", "title": "B03.01 Sila, rezultanta i dijagram sila — varijacija 1", "who": "Sol medium (predložak)", "task": "a) Kutiju mase \\(2\\ \\text{kg}\\) vučemo udesno po vodoravnom stolu pomoću vodoravne opruge konstante \\(100\\ \\text{N/m}\\), rastegnute za \\(4\\ \\text{cm}\\). U promatranom trenutku trenje djeluje silom \\(1\\ \\text{N}\\), a otpor zraka silom \\(1\\ \\text{N}\\), oboje ulijevo. Podloga djeluje na kutiju silom \\(20\\ \\text{N}\\) prema gore. Uzmi \\(g=10\\ \\text{m/s}^2\\). Kolike su sila teža i elastična sila na kutiju? Nacrtaj dijagram svih sila na kutiju te odredi iznos i smjer rezultante.\n\nb) Istu oprugu sada rastegnemo za \\(8\\ \\text{cm}\\). Kutija se i dalje giba udesno, a u promatranom trenutku trenje, otpor zraka i sila podloge imaju iste iznose i smjerove kao u a). Hoće li se udvostručiti i elastična sila i rezultanta? Odredi novu rezultantu i usporedi je s onom iz a).\n\nc) Kutiju zatim podignemo sa stola okomitom niti. U promatranom trenutku napetost niti iznosi \\(24\\ \\text{N}\\) prema gore, a ista opruga ponovno je vodoravna, pričvršćena desno od kutije i rastegnuta za \\(3\\ \\text{cm}\\). Kutija više ne dodiruje stol, a otpor zraka sada zanemarujemo. Nacrtaj novi dijagram sila te odredi iznos i smjer rezultante.", "expl": "## 🧰 Sile na kutiju\n\n**Kolike su sila teža i elastična sila na kutiju? Nacrtaj dijagram svih sila na kutiju te odredi iznos i smjer rezultante.**\n\nZadani su masa kutije \\(2\\ \\text{kg}\\), konstanta opruge \\(100\\ \\text{N/m}\\), rastezanje \\(4\\ \\text{cm}\\), dvije sile od po \\(1\\ \\text{N}\\) ulijevo te sila podloge \\(20\\ \\text{N}\\) prema gore.\n\n**Sila** opisuje djelovanje jednog tijela na drugo, poput povlačenja kutije oprugom. Ona je **vektorska veličina**: važni su njezin **iznos**, **smjer** i **hvatište**, odnosno mjesto na kojem djeluje. Zato nije isto povući kutiju jednakom silom udesno ili ulijevo, niti je povući za donji rub ili za vrh.\n\nMjerna jedinica sile je **njutn**, oznake \\(\\text{N}\\), nazvan po Isaacu Newtonu. Veza s osnovnim jedinicama glasi:\n\n$$1\\ \\text{N}=1\\ \\text{kg}\\cdot\\text{m/s}^2.$$\n\n**Sila teža** sila je kojom Zemlja privlači kutiju, uvijek prema dolje. Ovdje je označavamo slovom \\(G\\); ona nije isto što i **težina**, sila kojom kutija djeluje na podlogu ili ovjes. Vrijednost \\(g\\) ne treba pamtiti: u **knjižici formula, str. 5**, među *Konstantama*, piše da u zadatcima uzimamo \\(10\\ \\text{m/s}^2\\), jednako za tijela različitih masa blizu površine Zemlje.\n\nFormula za silu težu nije zasebno navedena u priloženoj knjižici, ali iz formule u **knjižici formula, str. 2**, poglavlje *Dinamika*, izvede se u dva reda:\n\n$$a=\\frac{F}{m}.$$\n\nKad na tijelo djeluje samo Zemljina privlačna sila, ubrzanje je \\(g\\), a sila je \\(G\\). Zato vrijedi:\n\n$$\\begin{aligned} g&=\\frac{G}{m} && /\\ \\cdot m \\\\ G&=mg. \\end{aligned}$$\n\nMasa i \\(g\\) već su u potrebnim jedinicama, pa uvrštavamo:\n\n$$G=2\\ \\text{kg}\\cdot10\\ \\text{m/s}^2=\\textcolor{green}{20\\ \\text{N}\\text{ prema dolje}}.$$\n\n**Elastična sila** sila je kojom se opruga pokušava vratiti u svoj nerastegnuti oblik, kao rastegnuta gumica koja vuče natrag. Djeluje **suprotno deformaciji**: ovdje rastegnuta opruga povlači kutiju prema svom desnom kraju. **Konstanta opruge** \\(k\\) opisuje njezinu krutost — veći \\(k\\) znači veću silu pri istom rastezanju.\n\nU **knjižici formula, str. 2**, poglavlje *Dinamika*, nalazi se **Hookeov zakon**:\n\n$$F_{elas}=kx.$$\n\nPrvo jedna zamka: rastezanje treba pretvoriti u metre jer je konstanta opruge zadana u njutnima po metru. Uvrštavanje broja 4 bez pretvorbe značilo bi rastezanje od četiri metra, a ne četiri centimetra.\n\n$$x=4\\ \\text{cm}=0{,}04\\ \\text{m}.$$\n\n$$F_{elas}=100\\ \\text{N/m}\\cdot0{,}04\\ \\text{m}=\\textcolor{green}{4\\ \\text{N}\\text{ udesno}}.$$\n\n**Dijagram sila** izdvoji kutiju iz okoline: nacrtamo je kao točku ili pravokutnik, a strelicama iz nje prikažemo sva djelovanja **na kutiju**. Strelica pokazuje smjer sile, a njezina duljina predstavlja iznos; pri crtanju lika početak strelice možemo postaviti u hvatište. Za dijagram s kutijom prikazanom točkom raspored je ovakav; pri crtanju na papiru duljine prilagodi iznosima:\n\n```text\n                 ↑ sila podloge\n                 │\ntrenje        ←──●──→ elastična sila\notpor zraka   ←──│\n                 ↓ sila teža\n```\n\n**Normalna sila podloge** ovdje je usmjerena prema gore; zove se normalna jer je okomita na površinu stola. **Trenje** je djelovanje dodirne površine koje se ovdje suprotstavlja klizanju, a **otpor zraka** djelovanje zraka koje se suprotstavlja gibanju kutije kroz zrak. Na dijagramu zato imamo pet sila: dvije okomite i tri vodoravne.\n\nZamka je nacrtati i silu kojom kutija pritišće stol: ona djeluje **na stol**, pa ne pripada dijagramu kutije. Ne crtamo ni **rezultantu kao dodatnu silu**, jer ona nije šesto djelovanje, nego zajednički učinak već nacrtanih sila.\n\n**Rezultantna sila** ili **ukupna sila** njihov je vektorski zbroj, poput zajedničkog učinka više povlačenja iste kutije. U knjižici nema zasebne formule za zbrajanje sila; pravilo slijedi iz značenja vektorskog zbroja: na istom pravcu odaberemo pozitivan smjer, a suprotnom smjeru pridružimo minus. Udesno i prema gore uzimamo kao pozitivno:\n\n$$F_{R,x}=4\\ \\text{N}-1\\ \\text{N}-1\\ \\text{N}=2\\ \\text{N}.$$\n\n$$F_{R,y}=20\\ \\text{N}-20\\ \\text{N}=0\\ \\text{N}.$$\n\n$$F_R=\\textcolor{green}{2\\ \\text{N}\\text{ udesno}}.$$\n\nOkomita djelovanja međusobno se poništavaju, ali vodoravna ne: opruga vuče jače nego što trenje i zrak zajedno djeluju ulijevo. Zato rezultanta pokazuje udesno.\n\n## 🔁 Dvostruko rastezanje\n\n**Hoće li se udvostručiti i elastična sila i rezultanta? Odredi novu rezultantu i usporedi je s onom iz a).**\n\nZadano je novo rastezanje iste opruge od \\(8\\ \\text{cm}\\), dok ostale sile ostaju kao u a).\n\n**Hookeov zakon** kaže da je elastična sila razmjerna rastezanju: dvostruko rastezanje iste opruge daje dvostruku elastičnu silu. Koristimo već navedenu formulu iz **knjižice formula, str. 2**, poglavlje *Dinamika*, uz izričitu pretvorbu:\n\n$$x_b=8\\ \\text{cm}=0{,}08\\ \\text{m}.$$\n\n$$F_{elas,b}=kx_b=100\\ \\text{N/m}\\cdot0{,}08\\ \\text{m}=\\textcolor{green}{8\\ \\text{N}}.$$\n\nZamka je zaključiti da se zato udvostručuje i **rezultanta**. Trenje i otpor zraka nisu se udvostručili, nego i dalje zajedno oduzimaju \\(2\\ \\text{N}\\) od sile opruge; okomite sile i dalje se poništavaju.\n\n$$F_{R,b}=8\\ \\text{N}-1\\ \\text{N}-1\\ \\text{N}=\\textcolor{green}{6\\ \\text{N}\\text{ udesno}}.$$\n\n$$\\frac{F_{R,b}}{F_{R,a}}=\\frac{6\\ \\text{N}}{2\\ \\text{N}}=\\textcolor{green}{3}.$$\n\nDakle, **elastična sila udvostručila se**, ali je **rezultanta postala triput veća**. To ima smisla: stalne suprotne sile čine velik dio početnih \\(4\\ \\text{N}\\), ali manji dio novih \\(8\\ \\text{N}\\).\n\n## 🪢 Kutija iznad stola\n\n**Nacrtaj novi dijagram sila te odredi iznos i smjer rezultante.**\n\nZadani su napetost niti \\(24\\ \\text{N}\\) prema gore i rastezanje iste opruge \\(3\\ \\text{cm}\\), a kutija više ne dodiruje stol i otpor zraka zanemarujemo.\n\n**Napetost niti** sila je kojom zategnuta nit vuče tijelo, poput užeta kojim podižemo teret. Djeluje duž niti, ovdje prema gore; nit vuče, a ne gura. Sila teža ostaje \\(20\\ \\text{N}\\) prema dolje jer se masa kutije nije promijenila.\n\nSada nema ni normalne sile stola ni trenja sa stolom, jer nema dodira. Otpor zraka izostavljamo zbog novog uvjeta u zadatku, pa na kutiju djeluju samo tri sile:\n\n```text\n             ↑ napetost niti\n             │\n             ●──→ elastična sila\n             │\n             ↓ sila teža\n```\n\nRastegnuta opruga i dalje vuče udesno, a njezin iznos ponovno računamo Hookeovim zakonom iz a). Najprije pretvaramo centimetre u metre:\n\n$$x_c=3\\ \\text{cm}=0{,}03\\ \\text{m}.$$\n\n$$F_{elas,c}=100\\ \\text{N/m}\\cdot0{,}03\\ \\text{m}=3\\ \\text{N}.$$\n\nVodoravno je ukupno djelovanje \\(3\\ \\text{N}\\) udesno, a okomito oduzimamo suprotno usmjerene sile. Dobivamo:\n\n$$F_{R,x}=3\\ \\text{N},\\qquad F_{R,y}=24\\ \\text{N}-20\\ \\text{N}=4\\ \\text{N}.$$\n\nZamka je zbrojiti ta dva iznosa i dobiti \\(7\\ \\text{N}\\): oni ne djeluju na istom pravcu, nego **okomito**. Njihov vektorski zbroj prikazujemo dijagonalom pravokutnika sa stranicama 3 i 4, pa iz osnovnoškolskog **Pitagorina poučka** slijedi:\n\n$$F_R^2=F_{R,x}^2+F_{R,y}^2.$$\n\n$$\\begin{aligned} F_R^2&=F_{R,x}^2+F_{R,y}^2 && /\\ \\sqrt{\\phantom{x}} \\\\ F_R&=\\sqrt{F_{R,x}^2+F_{R,y}^2}. \\end{aligned}$$\n\n$$F_R=\\sqrt{(3\\ \\text{N})^2+(4\\ \\text{N})^2}=\\sqrt{25\\ \\text{N}^2}=\\textcolor{green}{5\\ \\text{N}\\text{ koso udesno i prema gore}}.$$\n\nRezultanta je usmjerena više prema gore nego udesno jer je okomita komponenta veća od vodoravne. Njezin iznos veći je od svake komponente zasebno, ali manji od njihova običnog zbroja, što odgovara dijagonali pravokutnika.\n\n## ✅ Rezultati\n\na) \\(\\textcolor{green}{G=20\\ \\text{N}}\\) prema dolje, \\(\\textcolor{green}{F_{elas}=4\\ \\text{N}}\\) udesno; pet sila na dijagramu i \\(\\textcolor{green}{F_R=2\\ \\text{N}}\\) udesno.\n\nb) \\(\\textcolor{green}{F_{elas}=8\\ \\text{N}}\\), dvostruko veća; \\(\\textcolor{green}{F_R=6\\ \\text{N}}\\) udesno, triput veća.\n\nc) Tri sile na dijagramu: napetost niti prema gore, sila teža prema dolje i elastična sila udesno; \\(\\textcolor{green}{F_R=5\\ \\text{N}}\\) koso udesno i prema gore.", "ref": {"a": "Sila teža: 20 N prema dolje; elastična sila: 4 N udesno; rezultanta: 2 N udesno. Dijagram: sila podloge gore, sila teža dolje, opruga desno, trenje i otpor zraka lijevo.", "b": "Elastična sila: 8 N, dvostruko veća; rezultanta: 6 N udesno, triput veća.", "c": "Rezultanta: 5 N koso udesno i prema gore. Dijagram: napetost niti 24 N gore, sila teža 20 N dolje, elastična sila 3 N desno."}, "marks": []}];
const root = document.getElementById('root'), toc = document.getElementById('toc');
for (const c of data) {
  const el = document.createElement('div'); el.className = 'card' + (c.marks.length ? ' has' : ''); el.id = c.id;
  const notes = c.marks.length ? `<ul class=notes>${c.marks.map(m =>
    `<li><span class="tag ${m.kind}">${m.kind === 'mala' ? 'mala greška' : 'sitnica'}</span><b>${m.text.replaceAll('{,}', ',')}</b> — ${m.note}</li>`).join('')}</ul>` : '';
  const ref = Object.entries(c.ref).map(([p, r]) => `<tr><td>${p})</td><td>${render(String(r)).replace(/^<p>|<\/p>\s*$/g, '')}</td></tr>`).join('');
  el.innerHTML = `<h2>${c.title}</h2><div class=who>${c.who}</div>${notes}` + render(c.task) +
    `<details ${c.marks.length ? 'open' : ''}><summary>Objašnjenje</summary>${render(c.expl)}</details>` +
    `<details><summary>Rezultati</summary><table class=ref>${ref}</table></details>`;
  highlight(el, c.marks);
  root.appendChild(el);
  if (c.id.endsWith('-1')) toc.insertAdjacentHTML('beforeend', `<li>${c.title.replace(/ — varijacija 1$/, '')}: ` +
    [1].map(n => `<a href="#${c.id.slice(0, -2)}-${n}">v${n}</a>`).join(' ') + '</li>');
  if (c.marks.length) toc.lastElementChild.querySelector(`a[href="#${c.id}"]`).insertAdjacentText('afterend', c.marks.some(m => m.kind === 'mala') ? ' 🟠' : ' 🔵');
}
</script>
