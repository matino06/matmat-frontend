function render(s) {  // formule zaštiti od markdowna, pa ih vrati kao KaTeX
  const math = [];
  s = s.replace(/\$\$([\s\S]+?)\$\$|\\\(([\s\S]+?)\\\)/g, (m, a, b) => {

const data = [{"title": "B05.01 Mehanički rad — varijacija 1", "flags": [], "task": "Učenik vuče drveni sanduk mase 10 kg po ravnom vodoravnom podu. Konop kojim vuče napet je silom $F = 40\\ \\text{N}$ i zatvara kut $60^\\circ$ s podom. Sanduk se pomakne 4 m po podu, pri čemu se giba stalnom brzinom, bez ubrzavanja i usporavanja.\n\n**a)** Koliki je rad sile $F$ pri pomaku sanduka za 4 m?\n\n**b)** Koliki je rad sile trenja pri tom pomaku? Kolika je promjena kinetičke energije sanduka?\n\nNakon vučenja sanduk podignemo okomito uvis za 2 m, opet stalnom brzinom, pomoću konopa vezanog za sredinu sanduka.\n\n**c)** Koliki je rad sile napetosti konopa pri podizanju?\n\nSanduk vratimo na početno mjesto i sada konop vučemo vodoravno, uz istu silu $F = 40\\ \\text{N}$ i isti pomak 4 m.\n\n**d)** Koliko puta je rad sile $F$ veći nego u a) i koliki je tada iznos tog rada?", "expl": "## ⚡ Rad sile F pri vučenju\n\n**a) Koliki je rad sile F pri pomaku sanduka za 4 m?**\n\nRad je ono što sila učini kad pomakne tijelo, a mjeri se u džulima, pri čemu je $1\\ \\text{J} = 1\\ \\text{N}\\cdot\\text{m}$. Sila ne djeluje cijelom svojom vrijednošću na pomak. Učinak ima samo ona komponenta sile koja je u smjeru pomaka, dok okomita komponenta ne pomiče sanduk i ne obavlja rad. Formulu nalazimo u **knjižici formula, str. 2**, poglavlje *Dinamika*:\n\n$$ W = F s \\cos\\alpha $$\n\nGdje je $\\alpha$ kut između sile i pomaka. Pomak je vodoravan, a konop zatvara $60^\\circ$ s podom, pa je to upravo kut $\\alpha$. Iz tablice trigonometrijskih vrijednosti znamo $\\cos 60^\\circ = 0{,}5$.\n\n**Prvo jedna zamka.** Ljudi često pomnože $40\\ \\text{N}$ s $4\\ \\text{m}$ i dobiju $160\\ \\text{J}$. To je krivo, jer konop nije u smjeru pomaka. Samo komponenta $F\\cos 60^\\circ = 20\\ \\text{N}$ pomiče sanduk u smjeru puta.\n\n$$ W = 40\\ \\text{N} \\cdot 4\\ \\text{m} \\cdot 0{,}5 = \\textcolor{green}{80\\ \\text{J}} $$\n\n## 🧱 Rad sile trenja i promjena energije\n\n**b) Koliki je rad sile trenja pri tom pomaku? Kolika je promjena kinetičke energije sanduka?**\n\nSanduk se giba stalnom brzinom, pa se ne ubrzava. Iz druge Newtonove relacije $a = \\frac{F}{m}$ (**knjižica formula, str. 2**) slijedi da je rezultantna sila na sanduk jednaka nuli. Trenje u vodoravnom smjeru mora točno poništiti vodoravnu komponentu vuče, pa je sila trenja $F_{tr} = 20\\ \\text{N}$. **Ključna riječ u zadatku je stalnom**, jer ona određuje da trenje nije jednako cijeloj sili $F$, nego samo njezinoj vodoravnoj komponenti.\n\nTrenje djeluje suprotno pomaku, pa je kut između njega i pomaka $180^\\circ$, a $\\cos 180^\\circ = -1$. Predznak rada je zato negativan:\n\n$$ W_{tr} = F_{tr}\\, s \\cos 180^\\circ = 20\\ \\text{N} \\cdot 4\\ \\text{m} \\cdot (-1) = \\textcolor{green}{-80\\ \\text{J}} $$\n\nNegativan rad znači da sila oduzima energiju od sanduka, a ne da mu je daje. Sila teža i normalna sila podloge su okomite na pomak, pa njihov rad iznosi nula.\n\nUkupni rad svih sila je $80\\ \\text{J} + (-80\\ \\text{J}) = 0$. Prema **knjižici formula, str. 2**, rad izvršen na tijelu jednak je promjeni njegove energije, $W = \\Delta E$. Ukupni rad je nula, pa se kinetička energija ne mijenja. To je u skladu s time da se sanduk giba stalnom brzinom, a $\\Delta E_k = 0$.\n\n## 🏗️ Podizanje sanduka\n\n**c) Koliki je rad sile napetosti konopa pri podizanju?**\n\nPri podizanju stalnom brzinom sanduk je u ravnoteži, pa napetost konopa mora biti jednaka težini. Težina je $G = mg$, a prema zadatku $g = 10\\ \\text{m/s}^2$ (**knjižica formula, str. 5**). Napetost je tako $T = mg = 10\\ \\text{kg} \\cdot 10\\ \\text{m/s}^2 = 100\\ \\text{N}$.\n\nSila napetosti je usmjerena prema gore, kao i pomak, pa je $\\alpha = 0^\\circ$ i $\\cos 0^\\circ = 1$. Rad je pozitivan, jer sila daje energiju sanduku:\n\n$$ W_T = T\\, h \\cos 0^\\circ = 100\\ \\text{N} \\cdot 2\\ \\text{m} \\cdot 1 = \\textcolor{green}{200\\ \\text{J}} $$\n\nZa potvrdu, potencijalna energija sanduka u polju sile teže raste za $\\Delta E_{gp} = mg\\Delta h$ (**knjižica formula, str. 2**):\n\n$$ \\Delta E_{gp} = 10\\ \\text{kg} \\cdot 10\\ \\text{m/s}^2 \\cdot 2\\ \\text{m} = 200\\ \\text{J} $$\n\nRad napetosti jednak je porastu potencijalne energije, što je upravo $W = \\Delta E$. Sila teža pri tome radi $-200\\ \\text{J}$, pa ukupni rad i dalje iznosi nula, kao i kinetička energija.\n\n## 🔁 Vučenje po horizontali\n\n**d) Koliko puta je rad sile F veći nego u a) i koliki je tada iznos tog rada?**\n\nKad konop vučemo vodoravno, kut između sile i pomaka je $\\alpha = 0^\\circ$, pa je $\\cos 0^\\circ = 1$. Ovdje je $\\cos\\alpha$ jedina promjenjiva u formuli $W = F s \\cos\\alpha$ (**knjižica formula, str. 2**), a sila i pomak ostaju isti.\n\n$$ W' = 40\\ \\text{N} \\cdot 4\\ \\text{m} \\cdot 1 = \\textcolor{green}{160\\ \\text{J}} $$\n\nOmjer je $\\frac{160\\ \\text{J}}{80\\ \\text{J}} = 2$. Rad je dvostruko veći jer je $\\cos 0^\\circ = 1$, a $\\cos 60^\\circ = 0{,}5$. Kad bi konop bio okomit na pod, $\\alpha = 90^\\circ$, pa bi rad sile $F$ bio nula, bez obzira na to koliko je sila jaka.\n\n## ✅ Rezultati\n\n- **a)** $80\\ \\text{J}$\n- **b)** $-80\\ \\text{J}$, a promjena kinetičke energije je nula\n- **c)** $200\\ \\text{J}$\n- **d)** Rad je $2$ puta veći, iznosi $160\\ \\text{J}$", "check": {}, "ref": {"a": "80 J", "b": "−80 J (rad sile trenja); promjena kinetičke energije je 0", "c": "200 J", "d": "2 puta veći; 160 J"}}, {"title": "B05.01 Mehanički rad — varijacija 2", "flags": [], "task": "Skladištar gura kolica mase 20 kg po ravnom hodniku skladišta. Ručka kolica je pod kutom $60^\\circ$ prema vodoravnici, a skladištar na ručku djeluje silom $F = 100\\ \\text{N}$ usmjerenom prema dolje i naprijed. Kolica se pomaknu 6 m i pritom se gibaju stalnom brzinom.\n\n**a)** Koliki je rad sile kojom skladištar gura kolica pri pomaku od 6 m?\n\n**b)** Koliki je rad sile trenja pri tom pomaku? Koliki su radovi sile teže i normalne sile podloge? Kolika je promjena kinetičke energije kolica?\n\nKolica zatim natovarimo teretom tako da ukupna masa ostane 20 kg. Pomoću užeta vezanog za kolica podignemo ih okomito uvis za 1,5 m, opet stalnom brzinom.\n\n**c)** Koliki je rad sile napetosti užeta pri podizanju? Koliki je rad sile teže i što taj rezultat govori o tome gdje završi energija koju uže uloži?\n\nKolica vratimo na početak, gdje miruju, i sada ih gurnemo vodoravno silom $F = 100\\ \\text{N}$ kroz pomak 6 m. Trenje je u ovom slučaju $50\\ \\text{N}$.\n\n**d)** Koliki je rad sile guranja i koliko puta je veći nego u a)? Kolika je kinetička energija kolica na kraju pomaka i kojom brzinom se tada gibaju?", "expl": "## 🧭 Rad sile koja nije u smjeru pomaka\n\n**a) Koliki je rad sile kojom skladištar gura kolica pri pomaku od 6 m?**\n\nRad sile nije umnožak sile i puta, nego se u obzir uzima samo ona komponenta sile koja djeluje u smjeru pomaka. Ako je sila usmjerena točno duž puta, rad je jednak umnošku, a ako je pod kutom, dio sile gura kolica naprijed, a ostatak ih samo tlači prema podu. Formula je u **knjižici formula, str. 2, poglavlje Dinamika**:\n\n$$W = F\\, s\\, \\cos\\alpha$$\n\nKut $\\alpha$ je kut između sile i pomaka. Sila ide naprijed i prema dolje, a pomak je naprijed, pa je $\\alpha = 60^\\circ$.\n\nUvrštavamo $F = 100\\ \\text{N}$, $s = 6\\ \\text{m}$ i $\\cos 60^\\circ = 0{,}5$:\n\n$$W = 100\\ \\text{N} \\cdot 6\\ \\text{m} \\cdot 0{,}5 = 300\\ \\text{J}$$\n\nRezultat je pozitivan jer sila ima komponentu u smjeru pomaka, i to $F\\cos\\alpha = 50\\ \\text{N}$. **Zamka** je računati $100 \\cdot 6 = 600\\ \\text{J}$. Taj broj bi bio točan samo kad bi cijela sila išla u smjeru puta, a ovdje dio sile zapravo pritišće kolica u pod i ne pomiče ih.\n\n## ⚖️ Rad trenja i rad sila koje ne rade\n\n**b) Koliki je rad sile trenja pri tom pomaku? Koliki su radovi sile teže i normalne sile podloge? Kolika je promjena kinetičke energije kolica?**\n\nKolica se gibaju stalnom brzinom, pa je rezultantna sila nula. Zato sila trenja mora poništiti vodoravnu komponentu sile guranja. Ta komponenta je upravo $50\\ \\text{N}$, pa je $F_{tr} = 50\\ \\text{N}$.\n\nSila trenja je suprotna pomaku, pa je $\\cos 180^\\circ = -1$:\n\n$$W_{tr} = -F_{tr}\\, s = -50\\ \\text{N} \\cdot 6\\ \\text{m} = -300\\ \\text{J}$$\n\nSila teža i normalna sila su okomite na pomak, pa je $\\cos 90^\\circ = 0$ i njihov rad je nula. **Primijeti** da je rad trenja negativan jer trenje \"kradi\" energiju kolicima, dok rad nula znači da sila ne prenosi energiju uopće.\n\nUkupni rad svih sila je $300\\ \\text{J} - 300\\ \\text{J} + 0 + 0 = 0\\ \\text{J}$. Prema **knjižici formula, str. 2, poglavlje Dinamika**, vrijedi $W = \\Delta E$, pa je i promjena kinetičke energije nula. To je i očekivano jer se brzina ne mijenja. Sila guranja \"uloži\" 300 J, a trenje ih odmah \"odnese\".\n\n## 🏗️ Rad pri podizanju\n\n**c) Koliki je rad sile napetosti užeta pri podizanju? Koliki je rad sile teže i što taj rezultat govori o tome gdje završi energija koju uže uloži?**\n\nKolica se podižu stalnom brzinom, pa napetost užeta mora biti jednaka sili teže. Iz **knjižice konstanti, str. 5** uzimamo $g = 10\\ \\text{m/s}^2$, pa je:\n\n$$G = mg = 20\\ \\text{kg} \\cdot 10\\ \\text{m/s}^2 = 200\\ \\text{N}$$\n\nNapetost je usmjerena uvis, kao i pomak, pa je $\\cos 0^\\circ = 1$:\n\n$$W_N = 200\\ \\text{N} \\cdot 1{,}5\\ \\text{m} \\cdot 1 = 300\\ \\text{J}$$\n\nSila teža je usmjerena prema dolje, a pomak uvis, pa je $\\cos 180^\\circ = -1$ i rad je $W_G = -300\\ \\text{J}$. Ovo je **ključno**: rad sile teže je negativan jer ona pokušava vratiti kolica dolje. Njen rad jednak je promjeni potencijalne energije, $\\Delta E_{gp} = mg\\Delta h = 20 \\cdot 10 \\cdot 1{,}5 = 300\\ \\text{J}$, koja je ista formula iz **knjižice formula, str. 2**. Energija koju uže uloži ne nestaje, nego se pohrani u visini kolica. Zato je zbroj radova nula, a brzina ostaje ista.\n\n## 💪 Kad sila i pomak imaju isti smjer\n\n**d) Koliki je rad sile guranja i koliko puta je veći nego u a)? Kolika je kinetička energija kolica na kraju pomaka i kojom brzinom se tada gibaju?**\n\nSada je sila vodoravna, kao i pomak, pa je $\\cos 0^\\circ = 1$:\n\n$$W_F = 100\\ \\text{N} \\cdot 6\\ \\text{m} \\cdot 1 = 600\\ \\text{J}$$\n\nOmjer s a) je $600\\ \\text{J} / 300\\ \\text{J} = 2$. Rad je dva puta veći jer se u a) samo polovina sile ($\\cos 60^\\circ = 0{,}5$) koristila za pomak, a sada se koristi cijela sila.\n\nTrenje je $50\\ \\text{N}$ i ono ponovno radi $-300\\ \\text{J}$. Kolica su na početku mirovala, pa je promjena kinetičke energije jednaka ukupnom radu:\n\n$$\\Delta E_k = W_F + W_{tr} = 600\\ \\text{J} - 300\\ \\text{J} = 300\\ \\text{J}$$\n\nKinetička energija je $E_k = \\dfrac{mv^2}{2}$, također iz **knjižice formula, str. 2**. Zato je:\n\n$$v = \\sqrt{\\frac{2E_k}{m}} = \\sqrt{\\frac{2 \\cdot 300\\ \\text{J}}{20\\ \\text{kg}}} = \\sqrt{30}\\ \\text{m/s} \\approx 5{,}5\\ \\text{m/s}$$\n\n**Intuicija:** rad sile je dvaput veći, ali trenje \"pojede\" jedan dio, pa kinetička energija raste samo za 300 J. Kolica dobiju brzinu, ali ne tako brzo kao što bi bez trenja.\n\n## ✅ Rezultati\n\n- **a)** $W = 300\\ \\text{J}$\n- **b)** $W_{tr} = -300\\ \\text{J}$; rad sile teže i normalne sile je $0\\ \\text{J}$; $\\Delta E_k = 0\\ \\text{J}$\n- **c)** $W_N = 300\\ \\text{J}$; $W_G = -300\\ \\text{J}$, što znači da se energija pohranjuje kao potencijalna energija kolica\n- **d)** $W = 600\\ \\text{J}$, dva puta veći nego u a); $E_k = 300\\ \\text{J}$, $v \\approx 5{,}5\\ \\text{m/s}$", "check": {}, "ref": {"a": "$W = 300\\ \\text{J}$", "b": "Rad trenja je $-300\\ \\text{J}$; rad sile teže i normalne sile je $0\\ \\text{J}$; promjena kinetičke energije je $0\\ \\text{J}$.", "c": "Rad sile napetosti je $300\\ \\text{J}$; rad sile teže je $-300\\ \\text{J}$, pa se energija pohranjuje kao potencijalna energija kolica.", "d": "Rad sile guranja je $600\\ \\text{J}$, dva puta veći nego u a); kinetička energija je $300\\ \\text{J}$, a brzina je $v \\approx 5{,}5\\ \\text{m/s}$."}}, {"title": "B11.01 Idealni plin i veličine stanja — varijacija 1", "flags": [], "task": "Boca s kisikom za medicinsku uporabu stoji u skladištu bolnice. U boci je **320 g** kisika (O₂). Plin u boci možemo promatrati kao idealni plin.\n\n**a)** Koliko molekula kisika ima u boci?\n\n**b)** Ujutro je u skladištu temperatura t₁ = 27 °C, a popodne t₂ = 54 °C. Koliko se puta promijenila termodinamička temperatura plina u boci?\n\n**c)** Iz boce se ispusti dio kisika tako da u njoj ostane 160 g plina. Koliko se puta smanjio broj molekula u boci, a koliko se puta smanjio obujam plina u boci? Zašto je tako?\n\n**d)** Bocu zatim napunimo s 320 g ugljikova dioksida CO₂ umjesto kisika. Koliko se puta promijeni množina plina u odnosu na množinu kisika iz a)?", "expl": "## 🧪 a) Broj molekula\n\n**Koliko molekula kisika ima u boci?**\n\nPlin u boci je tvar koja se sastoji od ogromnog broja molekula, pa ih ne možemo prebrojati. Zato koristimo **množinu** n, odnosno broj mola. Mol je samo brojevna jedinica, kao što je tucet dvanaest komada, ali jedan mol znači 6,022·10²³ čestica. Veza između mase, molarne mase i broja čestica nalazi se u **knjižici formula, str. 3**, poglavlje *Termodinamika*, a Avogadrova konstanta N_A je na **str. 5**.\n\n$$n = \\frac{N}{N_A} = \\frac{m}{M}$$\n\nIz te veze broj čestica dobijemo kao N = n · N_A. Prvo nam treba molarna masa. Iz periodnog sustava je O = 16,0, pa je molekula O₂ teška M = 2 · 16,0 g/mol = 32 g/mol. Masa je zadana u gramima, a molarna masa u g/mol, pa nema potrebe za pretvorbom jedinica.\n\n$$n = \\frac{m}{M} = \\frac{320\\ \\text{g}}{32\\ \\text{g/mol}} = 10\\ \\text{mol}$$\n\n$$N = n \\cdot N_A = 10 \\cdot 6{,}022 \\cdot 10^{23} = 6{,}022 \\cdot 10^{24}$$\n\nKonačan rezultat: \\(\\textcolor{green}{N \\approx 6{,}0 \\cdot 10^{24}\\ \\text{molekula}}\\)\n\n## 🌡️ b) Promjena temperature\n\n**Koliko se puta promijenila termodinamička temperatura plina u boci?**\n\nTemperatura je veličina stanja plina, a termodinamička temperatura T se u računu uvijek koristi u kelvinima, a ne u Celzijevim stupnjevima. Veza je T = t + 273. Ta veza nije u knjižici formula, pa je treba znati napamet.\n\n**Zamka je** u tome što bi učenik mogao podijeliti 54 °C s 27 °C i dobiti 2, što je krivo. Razlog je da nula na Celzijevoj skali nije nulta temperatura, nego točka smrzavanja vode. Zato omjer ima smisla tek u kelvinima, čija nula je apsolutna nula.\n\n$$T_1 = 27 + 273 = 300\\ \\text{K}$$\n\n$$T_2 = 54 + 273 = 327\\ \\text{K}$$\n\n$$\\frac{T_2}{T_1} = \\frac{327\\ \\text{K}}{300\\ \\text{K}} = 1{,}09$$\n\nKonačan rezultat: \\(\\textcolor{green}{T_2 = 1{,}09 \\cdot T_1}\\). Razlika od 27 stupnjeva je ista u obje skale, ali omjer nije. Temperatura je porasla za samo oko 9 %, a ne dvostruko.\n\n## 🧊 c) Ispuštanje dijela plina\n\n**Koliko se puta smanjio broj molekula, a koliko se puta smanjio obujam plina? Zašto je tako?**\n\nNakon ispuštanja u boci ostaje 160 g kisika. Iz iste veze kao u a) dobijemo n = 160 g / 32 g/mol = 5 mol, pa je N = 5 · 6,022·10²³ ≈ 3,01·10²⁴ molekula. Omjer broja molekula je\n\n$$\\frac{N_{\\text{prije}}}{N_{\\text{poslije}}} = \\frac{6{,}022 \\cdot 10^{24}}{3{,}011 \\cdot 10^{24}} = 2$$\n\nBroj molekula smanjio se 2 puta. Obujam je veličina stanja koja pokazuje koliko prostora plin zauzima. Plin uvijek ispunjava cijelu posudu jer su njegove čestice daleko jedna od druge i gibaju se slobodno. Kad ispustimo pola kisika, preostale čestice se i dalje šire po cijeloj boci, pa se obujam ne mijenja. To je slično mirisu parfema u sobi: kad ga prska manje, miris je slabiji, ali i dalje ispunjava cijelu sobu.\n\nKonačan rezultat: \\(\\textcolor{green}{\\text{Broj molekula se smanjio 2 puta, obujam ostaje isti (1 puta)}}\\)\n\n## ⚖️ d) Ista masa, drugi plin\n\n**Koliko se puta promijeni množina plina u odnosu na kisik iz a)?**\n\n**Zamka je** u pretpostavci da ista masa znači isti broj čestica. To vrijedi samo ako su molarne mase jednake. Molekule različitih plinova različito su teške, pa ista masa daje različit broj mola. Slično je kao kad u vagu stavimo lubenice i jabuke: ista masa, ali različit broj komada.\n\nMolarna masa CO₂ iz periodnog sustava je C = 12,0, O = 16,0, pa je M = 12,0 + 2 · 16,0 g/mol = 44 g/mol. Množinu računamo istom formulom iz knjižice, n = m/M.\n\n$$n_{\\text{CO}_2} = \\frac{m}{M} = \\frac{320\\ \\text{g}}{44\\ \\text{g/mol}} \\approx 7{,}3\\ \\text{mol}$$\n\n$$\\frac{n_{\\text{O}_2}}{n_{\\text{CO}_2}} = \\frac{10\\ \\text{mol}}{7{,}27\\ \\text{mol}} \\approx 1{,}4$$\n\nBroj čestica je N = 7,27 · 6,022·10²³ ≈ 4,4·10²⁴. Konačan rezultat: \\(\\textcolor{green}{n_{\\text{CO}_2} \\approx 7{,}3\\ \\text{mol}}\\), što je oko 1,4 puta manje mola nego kisika.\n\n## ✅ Rezultati\n\n- a) N ≈ 6,0·10²⁴ molekula (n = 10 mol)\n- b) Termodinamička temperatura promijenila se 1,09 puta\n- c) Broj molekula smanjio se 2 puta, a obujam ostaje isti\n- d) Množina je oko 1,4 puta manja (n ≈ 7,3 mol), a broj molekula N ≈ 4,4·10²⁴", "check": {}, "ref": {"a": "N ≈ 6,0·10²⁴ molekula (n = 10 mol)", "b": "Termodinamička temperatura promijenila se 1,09 puta (T₁ = 300 K, T₂ = 327 K)", "c": "Broj molekula smanjio se 2 puta, a obujam plina ostaje isti jer plin uvijek ispunjava cijelu bocu.", "d": "Množina je oko 1,4 puta manja, n ≈ 7,3 mol, a broj molekula N ≈ 4,4·10²⁴."}}, {"title": "B11.01 Idealni plin i veličine stanja — varijacija 2", "flags": [], "task": "Spremnik u laboratoriju napunjen je dušikom (N₂). U spremniku je **56 g** dušika. Plin u spremniku možemo promatrati kao idealni plin. Spremnik je čvrst i zatvoren.\n\n**a)** Koliko molekula dušika ima u spremniku?\n\n**b)** Ujutro je u laboratoriju bilo t₁ = 7 °C, a popodne t₂ = 77 °C. Koliko se puta promijenila termodinamička temperatura plina u spremniku?\n\n**c)** Dio plina ispusti se kroz ventil tako da u spremniku ostane 28 g dušika. Koliko se puta smanjio broj molekula u spremniku, a koliko se puta smanjio obujam plina u njemu? Zašto je tako?\n\n**d)** Spremnik zatim ispraznimo i napunimo s 56 g vodika (H₂). Koliko se puta promijeni množina plina u odnosu na množinu dušika iz a)?", "expl": "## 🧪 Množina i broj molekula\n**Koliko molekula dušika ima u spremniku?**\nZadano je 56 g dušika, a traži se broj molekula. Prvo nam treba molarna masa. Molekula dušika je N₂, pa iz periodnog sustava (knjižica, str. 6) uzimamo $M(\\text{N}) = 14{,}0$ g/mol i dobivamo $M(\\text{N}_2) = 2 \\cdot 14{,}0 = 28$ g/mol.\n\nMnožina nije masa ni broj čestica, nego **brojevna jedinica**, kao što je tucet samo naziv za 12 komada. Jedan **mol** je $N_A = 6{,}022 \\cdot 10^{23}$ čestica (konstanta u knjižici, str. 5). Veza je u knjižici, str. 3: $n = \\frac{N}{N_A} = \\frac{m}{M}$. Iz nje prvo izračunamo množinu, a zatim preuredimo za broj molekula:\n\n$$\\begin{aligned} n &= \\frac{N}{N_A} && / \\cdot N_A \\\\ N &= n N_A \\end{aligned}$$\n\nSad uvrštavamo. Množina je:\n\n$$ n = \\frac{m}{M} = \\frac{56\\ \\text{g}}{28\\ \\text{g/mol}} = 2\\ \\text{mol} $$\n\nBroj molekula:\n\n$$ N = 2\\ \\text{mol} \\cdot 6{,}022 \\cdot 10^{23}\\ \\text{mol}^{-1} = 1{,}2044 \\cdot 10^{24} $$\n\nRezultat: \\textcolor{green}{$N \\approx 1{,}20 \\cdot 10^{24}$ molekula}.\n\n## 🌡️ Temperatura u kelvinima\n**Koliko se puta promijenila termodinamička temperatura plina u spremniku?**\nVeličine stanja su tlak, volumen, termodinamička temperatura i množina. Termodinamička temperatura se računa u **kelvinima**, a veza s Celzijevim stupnjevima je $T = t + 273$. Ta veza nije u knjižici pa ju treba zapamtiti.\n\nZamka je u tome što se čini da se temperatura promijenila $77 / 7 = 11$ puta. To je pogrešno, jer Celzijeva skala ima nulu na točki taljenja leda, a ne na apsolutnoj nuli. Zato se omjer računa tek u kelvinima:\n\n$$ T_1 = 7 + 273 = 280\\ \\text{K}, \\qquad T_2 = 77 + 273 = 350\\ \\text{K} $$\n\n$$ \\frac{T_2}{T_1} = \\frac{350\\ \\text{K}}{280\\ \\text{K}} = 1{,}25 $$\n\nRezultat: \\textcolor{green}{termodinamička temperatura promijenila se 1{,}25 puta}. Drugim riječima, porasla je za 25 %, a ne 11 puta.\n\n## 🚰 Ispuštanje plina\n**Koliko se puta smanjio broj molekula u spremniku, a koliko se puta smanjio obujam plina u njemu? Zašto je tako?**\nPrvo broj molekula. Ostaje 28 g dušika, što je točno polovica početne mase. Prema $n = \\frac{m}{M}$ množina se prepolovi, a time i $N = nN_A$. Broj molekula smanjio se **2 puta**.\n\nObujam je drugačija priča. Plin u posudi uvijek **ispunjava cijelu posudu**, jer se čestice slobodno gibaju po cijelom prostoru. Spremnik je čvrst, pa obujam plina ostaje isti. Obujam se nije smanjio, tj. smanjio se $1$ puta.\n\nZamka je pomisliti da se obujam prepolovio jer je manje plina. Ono što se prepolovilo je **masa plina po jedinici obujma**, tj. gustoća, koja je u knjižici, str. 2: $\\rho = \\frac{m}{V}$. Masa je pala na pola, a $V$ je ostao isti, pa je i $\\rho$ pao na pola.\n\nRezultat: \\textcolor{green}{broj molekula smanjio se 2 puta, a obujam se nije promijenio.}\n\n## ⚗️ Drugi plin u istom spremniku\n**Koliko se puta promijeni množina plina u odnosu na množinu dušika iz a)?**\nSad u spremnik stavljamo 56 g vodika. Molekula H₂ ima $M(\\text{H}_2) = 2 \\cdot 1{,}01 = 2{,}02$ g/mol. Masa je ista kao kod dušika, ali je molarna masa mnogo manja. Zato je množina veća:\n\n$$ n_{H_2} = \\frac{m}{M} = \\frac{56\\ \\text{g}}{2{,}02\\ \\text{g/mol}} = 27{,}7\\ \\text{mol} $$\n\nUsporedba s množinom dušika iz a):\n\n$$ \\frac{n_{H_2}}{n_{N_2}} = \\frac{27{,}7\\ \\text{mol}}{2\\ \\text{mol}} = 13{,}9 \\approx 14 $$\n\nIntuicija: molekula vodika je otprilike 14 puta lakša od molekule dušika, pa isti komad mase sadrži 14 puta više molekula, tj. 14 puta više molova.\n\nRezultat: \\textcolor{green}{množina se promijeni 13{,}9 ≈ 14 puta (povećala se)}.", "check": {}, "ref": {"a": "N ≈ 1{,}20 · 10²⁴ molekula", "b": "Termodinamička temperatura promijenila se 1{,}25 puta (T₁ = 280 K, T₂ = 350 K).", "c": "Broj molekula smanjio se 2 puta, a obujam plina se nije promijenio (ostao je isti jer plin uvijek ispunjava cijeli čvrsti spremnik; smanjila se masa, odnosno gustoća).", "d": "Množina se promijenila 13{,}9 ≈ 14 puta (n = 27{,}7 mol, u odnosu na 2 mol dušika)."}}, {"title": "B22.03 Indeks loma i lom svjetlosti — varijacija 1", "flags": [], "task": "Laserska olovka u zraku emitira crveno svjetlo valne duljine \\(\\lambda_0 = 600 \\ \\text{nm}\\). Zraka pada na ravnu plohu prozirne staklene ploče indeksa loma \\(n = 1{,}5\\), tako da s površinom stakla zatvara kut \\(60^\\circ\\).\n\na) Pod kojim kutom \\(\\beta\\) od okomice na plohu se zraka lomi u staklu?\n\nb) Kolika su brzina i valna duljina svjetlosti u staklu? Za koliko se puta promijenila brzina pri ulasku u staklo, a koja veličina pritom ostaje ista?\n\nc) Zraka prolazi kroz ploču i izlazi u zrak kroz suprotnu, paralelnu plohu. Pod kojim kutom od okomice zraka izlazi u zrak? Je li izlazna zraka paralelna upadnoj i zašto?\n\nd) Ista ploča sada služi kao svjetlovod: svjetlost unutar stakla pada na plohu prema zraku. Koliki je najveći upadni kut (mjeren od okomice) pri kojem svjetlost još može izaći u zrak? Što se događa ako svjetlost unutar stakla pada pod kutom \\(50^\\circ\\) od okomice?", "expl": "## 📐 a) Kut loma u staklu\n\n**Pod kojim kutom \\(\\beta\\) od okomice na plohu se zraka lomi u staklu?**\n\nZraka pada na staklo iz zraka, pa je treba promatrati u odnosu na okomicu na plohu, a ne u odnosu na samu plohu. Zraka zatvara \\(60^\\circ\\) s površinom, pa je upadni kut \\(\\alpha = 90^\\circ - 60^\\circ = 30^\\circ\\). Ovo je zamka: \\(60^\\circ\\) je kut prema površini, a ne upadni kut.\n\nKut loma računamo iz Snellova zakona, koji se nalazi u **knjižici formula, str. 4**, poglavlje *Optika*:\n\n$$\\frac{\\sin \\alpha}{\\sin \\beta} = \\frac{n_2}{n_1}$$\n\nZrak je prvo sredstvo (\\(n_1 \\approx 1\\)), a staklo drugo (\\(n_2 = 1{,}5\\)). Prije uvrštavanja preuredimo formulu tako da izrazimo \\(\\sin \\beta\\):\n\n$$\\begin{aligned} \\frac{\\sin \\alpha}{\\sin \\beta} &= \\frac{n_2}{n_1} && / \\cdot \\sin \\beta \\\\ \\sin \\alpha &= \\frac{n_2}{n_1} \\sin \\beta && / : \\frac{n_2}{n_1} \\\\ \\sin \\beta &= \\frac{n_1}{n_2} \\sin \\alpha \\end{aligned}$$\n\nSad uvrštavamo: \\(n_1 = 1\\), \\(n_2 = 1{,}5\\), \\(\\sin 30^\\circ = 0{,}5\\):\n\n$$\\sin \\beta = \\frac{1}{1{,}5} \\cdot 0{,}5 = \\frac{0{,}5}{1{,}5} = \\frac{1}{3} \\approx 0{,}333$$\n\nKut loma dobivamo inverznim sinusom: \\(\\beta = \\sin^{-1}(0{,}333) \\approx 19{,}5^\\circ\\). Rezultat je \\(\\textcolor{green}{\\beta \\approx 19{,}5^\\circ}\\).\n\nPrimijeti da je kut loma manji od upadnog. Staklo je optički gušće od zraka, pa se zraka lomi prema okomici.\n\n## ⚡ b) Brzina i valna duljina u staklu\n\n**Kolika su brzina i valna duljina svjetlosti u staklu? Za koliko se puta promijenila brzina, a koja veličina ostaje ista?**\n\nBrzina svjetlosti u sredstvu povezana je s indeksom loma preko formule \\(n = \\frac{c}{v}\\), koja se nalazi u **knjižici formula, str. 4**, poglavlje *Optika*. Brzinu u vakuumu \\(c = 3 \\cdot 10^8 \\ \\text{m/s}\\) uzimamo iz **knjižice formula, str. 5**, tablica konstanti. Preuređenjem dobivamo:\n\n$$\\begin{aligned} n &= \\frac{c}{v} && / \\cdot v \\\\ n v &= c && / : n \\\\ v &= \\frac{c}{n} \\end{aligned}$$\n\nUvrštavamo: \n\n$$v = \\frac{3 \\cdot 10^8 \\ \\text{m/s}}{1{,}5} = 2 \\cdot 10^8 \\ \\text{m/s}$$\n\nSvjetlost je u staklu dvostruko sporija od brzine u vakuumu... točnije, brzina se smanjila \\(1{,}5\\) puta, jer je \\(n = 1{,}5\\).\n\nZa valnu duljinu trebamo najprije frekvenciju. Ona se pri prijelazu u drugo sredstvo ne mijenja, pa je možemo izračunati iz vakuumskih ili zračnih podataka. U zraku je \\(n \\approx 1\\), pa vrijedi \\(c = \\lambda_0 f\\). Ta veza proizlazi iz \\(v = \\frac{\\lambda}{T}\\) i \\(f = \\frac{1}{T}\\) (**knjižica formula, str. 4 i str. 2**), jer je \\(v = \\lambda f\\). Iz nje dobivamo frekvenciju:\n\n$$f = \\frac{c}{\\lambda_0} = \\frac{3 \\cdot 10^8 \\ \\text{m/s}}{6 \\cdot 10^{-7} \\ \\text{m}} = 5 \\cdot 10^{14} \\ \\text{Hz}$$\n\nSad u staklu koristimo \\(v = \\lambda f\\), pa je valna duljina:\n\n$$\\lambda = \\frac{v}{f} = \\frac{2 \\cdot 10^8 \\ \\text{m/s}}{5 \\cdot 10^{14} \\ \\text{Hz}} = 4 \\cdot 10^{-7} \\ \\text{m} = 400 \\ \\text{nm}$$\n\nIsti rezultat dobivamo jednostavnije: \\(\\lambda = \\frac{\\lambda_0}{n} = \\frac{600 \\ \\text{nm}}{1{,}5} = 400 \\ \\text{nm}\\). Rezultat je \\(\\textcolor{green}{v = 2 \\cdot 10^8 \\ \\text{m/s}, \\ \\lambda = 400 \\ \\text{nm}}\\).\n\nPri ulasku u staklo frekvencija ostaje \\(5 \\cdot 10^{14} \\ \\text{Hz}\\). Brzina i valna duljina se mijenjaju, ali se mijenjaju tako da se njihov omjer ne mijenja, jer frekvencija ostaje ista. Frekvencija određuje boju svjetla, pa crveno svjetlo ostaje crveno i u staklu.\n\n## 🔁 c) Izlazak iz ploče u zrak\n\n**Pod kojim kutom od okomice zraka izlazi u zrak? Je li izlazna zraka paralelna upadnoj i zašto?**\n\nNa drugoj plohi zraka pada na granicu staklo–zrak. Upadni kut na toj plohi jednak je kutu loma na prvoj plohi, \\(\\alpha' = \\beta \\approx 19{,}5^\\circ\\), jer su plohe paralelne. Sad primjenjujemo Snellov zakon za prijelaz iz stakla u zrak, pa je \\(n_1 = 1{,}5\\) (staklo), a \\(n_2 \\approx 1\\) (zrak). Kut izlaska \\(\\gamma\\) računamo iz:\n\n$$n_1 \\sin \\beta = n_2 \\sin \\gamma$$\n\nUvrštavamo \\(\\sin \\beta = \\frac{1}{3}\\) iz dijela a):\n\n$$\\sin \\gamma = \\frac{1{,}5 \\cdot \\frac{1}{3}}{1} = 0{,}5$$\n\nKut je \\(\\gamma = \\sin^{-1}(0{,}5) = 30^\\circ\\). Rezultat je \\(\\textcolor{green}{\\gamma = 30^\\circ}\\).\n\nKut izlaska je jednak početnom upadnom kutu od \\(30^\\circ\\). Zato je izlazna zraka paralelna upadnoj, samo je pomaknuta u stranu. Razlog je simetrija: ulazak lomi zraku prema okomici, a izlazak je lomi od okomice za istu mjeru. Ploča sama po sebi ne skreće zraku, nego je samo pomakne.\n\n## 🌊 d) Totalna refleksija u svjetlovodu\n\n**Koliki je najveći upadni kut pri kojem svjetlost još može izaći u zrak? Što se događa pri \\(50^\\circ\\)?**\n\nSvjetlost unutar stakla pada na plohu prema zraku, pa je ovdje staklo optički gušće sredstvo i prijelaz je iz gušćeg u rjeđe. Pri tom prijelazu zraka se lomi od okomice, pa kut loma raste brže od upadnog kuta. Kad upadni kut dosegne granični, kut loma postaje \\(90^\\circ\\), tj. zraka kliže uz granicu. Veći upadni kutovi daju totalnu refleksiju.\n\nGranični kut računamo iz Snellova zakona uz \\(\\beta = 90^\\circ\\). Formula je u **knjižici formula, str. 4**, a u ovom slučaju glasi \\(\\sin \\alpha_g = \\frac{n_2}{n_1}\\), uz \\(n_1 = 1{,}5\\) (staklo) i \\(n_2 = 1\\) (zrak):\n\n$$\\sin \\alpha_g = \\frac{1}{1{,}5} = \\frac{2}{3} \\approx 0{,}667$$\n\n$$\\alpha_g = \\sin^{-1}(0{,}667) \\approx 41{,}8^\\circ$$\n\nZa upadni kut veći od \\(41{,}8^\\circ\\) nema izlaska: sva se svjetlost odbija natrag u staklo. Pri \\(50^\\circ\\) dolazi do totalne refleksije, a sav snop ostaje u staklu i prolazi kroz ploču dalje, što je princip svjetlovoda, optičkih vlakana i endoskopa.\n\nZamka je u tome što je \\(50^\\circ\\) mjereno od okomice, a ne od plohe. Taj upadni kut je veći od graničnog, pa refleksija nastaje. Da je kut bio \\(50^\\circ\\) od plohe, upadni kut bi bio \\(40^\\circ\\), što je manje od \\(41{,}8^\\circ\\), i svjetlost bi djelomično izašla.\n\n$$\\textcolor{green}{\\alpha_g \\approx 41{,}8^\\circ; \\text{ pri } 50^\\circ \\text{ nastaje totalna refleksija}}$$", "check": {}, "ref": {"a": "β ≈ 19,5°", "b": "v = 2·10⁸ m/s, λ = 400 nm; brzina se smanjila 1,5 puta, a frekvencija (5·10¹⁴ Hz) ostaje ista.", "c": "γ = 30°; izlazna zraka je paralelna upadnoj jer su plohe paralelne, pa je ulazni lom i izlazni lom jednak po iznosu, a suprotnog smjera.", "d": "α_g ≈ 41,8°; pri upadnom kutu 50° nastaje totalna refleksija i sva se svjetlost odbija u staklo."}}, {"title": "B22.03 Indeks loma i lom svjetlosti — varijacija 2", "flags": [], "task": "Učenik na satu fizike svijetli laserskom olovkom u zrak. Crveno svjetlo laserske olovke ima valnu duljinu u zraku \\(\\lambda_0 = 500 \\ \\text{nm}\\). Zraka pada na ravnu površinu vode u akvariju tako da s površinom vode zatvara kut \\(30^\\circ\\). Indeks loma vode je \\(n = 1{,}33\\).\n\na) Pod kojim kutom \\(\\beta\\) od okomice na površinu se zraka lomi u vodi?\n\nb) Kolika su brzina i valna duljina svjetlosti u vodi? Za koliko se puta promijenila brzina pri ulasku u vodu, a koja veličina pritom ostaje ista?\n\nc) Zraka prolazi kroz vodu i izlazi u zrak kroz dno posude, koje je paralelno površini. Pod kojim kutom od okomice zraka izlazi u zrak? Je li izlazna zraka paralelna upadnoj i zašto?\n\nd) Ista voda sada služi kao svjetlovod: svjetlost unutar vode pada na površinu prema zraku. Koliki je najveći upadni kut (mjeren od okomice) pri kojem svjetlost još može izaći u zrak? Što se događa ako svjetlost unutar vode pada pod kutom \\(55^\\circ\\) od okomice?", "expl": "## 🔍 Kut loma u vodi\n\n**Pod kojim kutom \\(\\beta\\) od okomice na površinu se zraka lomi u vodi?**\n\nZadan je kut između zrake i površine, a kut loma mjerimo od okomice, pa prvo moramo odrediti upadni kut. Zamka je ovdje: kut od površine nije upadni kut. Upadni kut je \\(\\alpha = 90^\\circ - 30^\\circ = 60^\\circ\\).\n\nZraka prelazi iz zraka u vodu, a voda je optički gušće sredstvo, pa se zraka mora lomiti prema okomici, tj. \\(\\beta\\) mora biti manji od \\(60^\\circ\\). To ćemo provjeriti na kraju. Formula je u **knjižici formula, str. 4, poglavlje Optika**:\n\n$$\\frac{\\sin \\alpha}{\\sin \\beta} = \\frac{n_2}{n_1}$$\n\nPreuredimo je tako da izrazimo \\(\\sin\\beta\\):\n\n$$\\begin{aligned} \\frac{\\sin \\alpha}{\\sin \\beta} &= \\frac{n_2}{n_1} && / \\cdot \\sin\\beta \\cdot n_1 \\\\ n_1 \\sin \\alpha &= n_2 \\sin \\beta && / : n_2 \\\\ \\sin \\beta &= \\frac{n_1 \\sin \\alpha}{n_2} \\end{aligned}$$\n\nZrak je sredstvo 1, pa je \\(n_1 = 1\\), a voda je sredstvo 2 s \\(n_2 = 1{,}33\\). Uvrštavamo:\n\n$$\\sin \\beta = \\frac{1 \\cdot \\sin 60^\\circ}{1{,}33} = \\frac{0{,}866}{1{,}33} = 0{,}651$$\n\nKut dobijemo inverznim sinusom: \\(\\beta = \\sin^{-1}(0{,}651) \\approx 40{,}6^\\circ\\). Kut je manji od \\(60^\\circ\\), pa je lom prema okomici, kao što smo i očekivali.\n\n## ⚡ Brzina i valna duljina u vodi\n\n**Kolika su brzina i valna duljina svjetlosti u vodi? Za koliko se puta promijenila brzina pri ulasku u vodu, a koja veličina pritom ostaje ista?**\n\nIndeks loma govori koliko je puta svjetlost u sredstvu sporija nego u vakuumu. Iz **knjižice formula, str. 4, poglavlje Optika** imamo \\(n = \\frac{c}{v}\\). Preuredimo je za brzinu:\n\n$$\\begin{aligned} n &= \\frac{c}{v} && / \\cdot v \\\\ n v &= c && / : n \\\\ v &= \\frac{c}{n} \\end{aligned}$$\n\nBrzina svjetlosti u vakuumu je \\(c = 3 \\cdot 10^8 \\ \\text{m/s}\\), pa je u vodi:\n\n$$v = \\frac{3 \\cdot 10^8 \\ \\text{m/s}}{1{,}33} = 2{,}26 \\cdot 10^8 \\ \\text{m/s}$$\n\nBrzina se pri ulasku u vodu smanjila \\(1{,}33\\) puta, što je upravo vrijednost indeksa loma.\n\nValnu duljinu ne nalazimo izravno u knjižici. Nema je u knjižici, ali se iz nje izvede u dva reda. Iz \\(v = \\lambda f\\) slijedi \\(\\lambda = \\frac{v}{f}\\). Frekvencija je ista kao u zraku, pa je \\(f = \\frac{c}{\\lambda_0}\\), a brzina u vodi \\(v = \\frac{c}{n}\\), što daje \\(\\lambda = \\frac{\\lambda_0}{n}\\).\n\nZa frekvenciju računamo u zraku:\n\n$$f = \\frac{3 \\cdot 10^8 \\ \\text{m/s}}{500 \\cdot 10^{-9} \\ \\text{m}} = 6 \\cdot 10^{14} \\ \\text{Hz}$$\n\nTada je valna duljina u vodi:\n\n$$\\lambda = \\frac{v}{f} = \\frac{2{,}26 \\cdot 10^8 \\ \\text{m/s}}{6 \\cdot 10^{14} \\ \\text{Hz}} = 3{,}76 \\cdot 10^{-7} \\ \\text{m} = 376 \\ \\text{nm}$$\n\nOstaje ista **frekvencija** svjetlosti, jer je određuje izvor. Mijenjaju se brzina i valna duljina.\n\n## 🔁 Izlazak iz ploče\n\n**Pod kojim kutom od okomice zraka izlazi u zrak? Je li izlazna zraka paralelna upadnoj i zašto?**\n\nSad svjetlost prelazi iz vode u zrak, pa je vode sredstvo 1 (\\(n_1 = 1{,}33\\)), a zrak sredstvo 2 (\\(n_2 = 1\\)). Kut pri unutarnjem upadu na dno jednak je kutu \\(\\beta\\) iz a) jer je dno paralelno površini, a upadni kut u vodi jednak je kutu loma \\(\\beta\\) s prve granice, pa primjenjujemo isti Snellov zakon iz **knjižice formula, str. 4**:\n\n$$n_1 \\sin \\beta = n_2 \\sin \\alpha_{iz}$$\n\nPreuredimo za \\(\\sin\\alpha_{iz}\\):\n\n$$\\begin{aligned} n_1 \\sin \\beta &= n_2 \\sin \\alpha_{iz} && / : n_2 \\\\ \\sin \\alpha_{iz} &= \\frac{n_1 \\sin \\beta}{n_2} \\end{aligned}$$\n\nUvrštavamo:\n\n$$\\sin \\alpha_{iz} = \\frac{1{,}33 \\cdot 0{,}651}{1} = 0{,}866$$\n\n\\(\\alpha_{iz} = \\sin^{-1}(0{,}866) = 60^\\circ\\). Zraka izlazi pod istim kutom kao što je ušla.\n\nIzlazna zraka je paralelna upadnoj, jer su plohe paralelne i okomica je ista za obje granice. Zraka se na ulazu i izlazu lomi, ali se ti lomovi međusobno poništavaju. Ipak, zraka je pri prolasku kroz vodu pomaknuta u stranu. Zamka je u tome što se čini da bi se zraka dodatno skrenula, a ona se samo pomakne paralelno.\n\n## 🌊 Granični kut i totalna refleksija\n\n**Koliki je najveći upadni kut pri kojem svjetlost još može izaći u zrak? Što se događa pod kutom \\(55^\\circ\\)?**\n\nNajveći upadni kut je **granični kut**, pri kojem lomljena zraka ide uz samu površinu, tj. kut loma je \\(90^\\circ\\). Nema je u knjižici, ali se iz Snellova zakona izvede u dva reda. Uvrstimo \\(\\beta = 90^\\circ\\), pa je \\(\\sin 90^\\circ = 1\\) i iz \\(n_1 \\sin\\alpha_g = n_2 \\sin 90^\\circ\\) slijedi:\n\n$$\\sin \\alpha_g = \\frac{n_2}{n_1} = \\frac{1}{1{,}33} = 0{,}752$$\n\nKut je \\(\\alpha_g = \\sin^{-1}(0{,}752) \\approx 48{,}8^\\circ\\). Pri kutovima manjima od toga svjetlost izlazi u zrak. Pri većima nema izlaza.\n\nPod kutom \\(55^\\circ\\) od okomice je \\(\\sin 55^\\circ = 0{,}819\\), što je veće od \\(0{,}752\\). Nema lomljene zrake, pa nastaje **totalna refleksija**: sva se svjetlost odbija natrag u vodu. Upravo tako svjetlost ostaje zarobljena u mlazu vode i može se voditi kroz njega, kao u optičkim vlaknima.\n\n## ✅ Rezultati\n\n- a) \\(\\beta \\approx 40{,}6^\\circ\\)\n- b) \\(v \\approx 2{,}26 \\cdot 10^8 \\ \\text{m/s}\\), \\(\\lambda \\approx 376 \\ \\text{nm}\\); brzina se smanjila 1,33 puta, a frekvencija ostaje ista\n- c) \\(60^\\circ\\) od okomice; izlazna zraka je paralelna upadnoj jer su plohe paralelne, a zraka je samo pomaknuta u stranu\n- d) najveći kut je \\(\\approx 48{,}8^\\circ\\); pod \\(55^\\circ\\) nastaje totalna refleksija i sva se svjetlost odbija natrag u vodu", "check": {}, "ref": {"a": "β ≈ 40,6°", "b": "v ≈ 2,26·10⁸ m/s, λ ≈ 376 nm; brzina se smanjila 1,33 puta, a frekvencija ostaje ista", "c": "60° od okomice; izlazna zraka je paralelna upadnoj jer su plohe paralelne, samo je pomaknuta u stranu", "d": "najveći kut ≈ 48,8°; pod 55° nastaje totalna refleksija i sva se svjetlost odbija natrag u vodu"}}];
const root = document.getElementById('root');
for (const c of data) {
  const el = document.createElement('div'); el.className='card';
  const rows = Object.entries(c.check).map(([p,r]) => `<tr><td>${p}</td><td>${c.ref[p]}</td>` +
     Object.entries(r).map(([n,x]) => `<td>${x.ok?'✅':'❌'} ${n}: ${x.odgovor}</td>`).join('') + '</tr>').join('');
  el.innerHTML = `<h2>${c.title}</h2>${c.flags.map(f=>`<div class=flag>${f}</div>`).join('')}` + render(c.task) +
    `<details><summary>Objašnjenje</summary>${render(c.expl)}</details>` +
    `<details><summary>Provjera rješavača</summary><table>${rows}</table></details>`;
  root.appendChild(el);
}
